CycleId:
  name: cycleId
  in: query
  required: true
  description: Opaque admission-cycle identifier.
  schema:
    type: string
    format: uuid

CycleIdOptional:
  name: cycleId
  in: query
  required: false
  description: >-
    Optional opaque admission-cycle filter. When omitted, return the candidate's applications
    across cycles.
  schema:
    type: string
    format: uuid

Limit:
  name: limit
  in: query
  required: false
  description: Maximum records per page; default 25 and maximum 100.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 25

Cursor:
  name: cursor
  in: query
  required: false
  description: Opaque cursor returned by the previous page. Do not construct or modify
    it.
  schema:
    type: string
    minLength: 1
    maxLength: 2048

ProgramSort:
  name: sort
  in: query
  required: false
  description: >-
    Allow-listed comma-separated sort keys; prefix a key with '-' for descending order.
  schema:
    type: string
    default: name
    example: -applicationOpensAt,name

SpecialtySort:
  name: sort
  in: query
  required: false
  description: >-
    Allow-listed comma-separated sort keys; prefix a key with '-' for descending order.
  schema:
    type: string
    default: name

TrainingSiteSort:
  name: sort
  in: query
  required: false
  description: >-
    Allow-listed comma-separated sort keys; prefix a key with '-' for descending order.
  schema:
    type: string
    default: name

ApplicationId:
  name: applicationId
  in: path
  required: true
  description: Opaque application identifier.
  schema:
    type: string
    format: uuid

AttachmentSlotId:
  name: slotId
  in: path
  required: true
  description: >-
    Opaque attachment slot identifier returned by listApplicationAttachmentSlots.
    Clients must not construct it.
  schema:
    type: string
    minLength: 1
    maxLength: 128

PortfolioId:
  name: portfolioId
  in: path
  required: true
  description: Opaque portfolio identifier.
  schema:
    type: string
    format: uuid

SectionKey:
  name: sectionKey
  in: path
  required: true
  schema:
    type: string
    enum:
      - application-information
      - personal-information
      - academic-information
      - english-proficiency
      - internship-information
      - residency-information
      - board-license-information
      - residency-entrance-exam
