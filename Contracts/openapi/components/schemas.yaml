Program:
  type: object
  additionalProperties: false
  required:
    - id
    - code
    - name
    - category
  properties:
    id:
      type: string
      format: uuid
    code:
      type: string
    name:
      type: string
    category:
      type: string
      enum:
        - CERTIFICATE
        - INTERNSHIP
        - RESIDENCY
        - FELLOWSHIP
    cycleId:
      type: string
      format: uuid
    applicationOpensAt:
      type:
        - string
        - "null"
      format: date-time
    applicationClosesAt:
      type:
        - string
        - "null"
      format: date-time
    timeZoneId:
      type: string
      example: Asia/Dubai
      description: IANA time zone in which the opening and deadline dates are defined.

Specialty:
  type: object
  additionalProperties: false
  required:
    - id
    - code
    - name
  properties:
    id:
      type: string
      format: uuid
    code:
      type: string
    name:
      type: string

TrainingSite:
  type: object
  additionalProperties: false
  required:
    - id
    - code
    - name
  properties:
    id:
      type: string
      format: uuid
    code:
      type: string
    name:
      type: string

ApplicationStatus:
  type: string
  description: >-
    Candidate-visible application lifecycle status. Internal workflow statuses are
    not exposed by this schema.
  enum:
    - DRAFT
    - SUBMITTED
    - UNDER_REVIEW
    - CORRECTION_REQUIRED
    - CORRECTION_SUBMITTED
    - SCREENED_OUT
    - REVIEW_COMPLETED
    - APPEAL_UNDER_REVIEW
    - WITHDRAWN
    - ARCHIVED

VerificationStatus:
  type: string
  enum:
    - PENDING
    - IN_PROGRESS
    - CORRECTION_REQUIRED
    - CORRECTION_SUBMITTED
    - PENDING_CLARIFICATION
    - CLARIFICATION_SUBMITTED
    - SCREEN_OUT_PENDING_APPROVAL
    - RE_EVALUATING
    - COMPLETE
    - SCREENED_OUT
    - ON_HOLD

PortfolioStatus:
  type: string
  description: >-
    Overall portfolio-scoring status (BRD Portfolio Status profile). It is separate
    from each round's PortfolioRoundStatus and must not be combined with it.
  enum:
    - PENDING
    - IN_PROGRESS
    - THIRD_REFEREE_REQUIRED
    - THIRD_ROUND_IN_PROGRESS
    - COMPLETE
    - SECOND_EVALUATION_REQUIRED
    - SECOND_EVALUATION_IN_PROGRESS
    - ON_HOLD

PortfolioRoundStatus:
  type: string
  description: >-
    Status of one scoring round (BRD Portfolio Round Status profile). ON_HOLD reverts
    to the previous status when a withdrawn or screened-out application is reinstated.
  enum:
    - PENDING
    - IN_PROGRESS
    - COMPLETE
    - ON_HOLD

AnnouncementStatus:
  type: string
  enum:
    - PENDING
    - READY_FOR_INITIAL_ANNOUNCEMENT
    - ANNOUNCED
    - APPEAL_UNDER_REVIEW
    - READY_FOR_REANNOUNCEMENT
    - REANNOUNCED

PaymentStatus:
  type: string
  enum:
    - PENDING
    - PAID
    - FAILED
    - CANCELLED
    - UNKNOWN

PaymentGatewayProvider:
  type: string
  description: Internal adapter identifier. Never expose this value to candidate clients.
  enum:
    - E_PAY
    - NETWORK_INTERNATIONAL

PaymentRoutingConfiguration:
  type: object
  description: >-
    Internal deployment configuration; never expose secrets or this object to candidate
    clients.
  additionalProperties: false
  required:
    - activeProvider
    - version
    - effectiveAt
  properties:
    activeProvider:
      $ref: "#/PaymentGatewayProvider"
    version:
      type: string
      description: Immutable configuration version captured by newly created payment
        sessions.
    effectiveAt:
      type: string
      format: date-time

PaymentGatewayCreateRequest:
  type: object
  description: Provider-neutral payment service to adapter request.
  additionalProperties: false
  required:
    - paymentSessionId
    - amount
    - currency
    - returnUrl
    - idempotencyKey
  properties:
    paymentSessionId:
      type: string
      format: uuid
    amount:
      type: number
      exclusiveMinimum: 0
    currency:
      const: AED
    returnUrl:
      type: string
      format: uri
    idempotencyKey:
      type: string
      minLength: 16
      maxLength: 128

PaymentGatewayCheckoutResult:
  type: object
  description: Provider-neutral adapter result; provider payloads remain inside the
    adapter.
  additionalProperties: false
  required:
    - providerSessionReference
    - checkoutUrl
  properties:
    providerSessionReference:
      type: string
    checkoutUrl:
      type: string
      format: uri
    expiresAt:
      type:
        - string
        - "null"
      format: date-time

PaymentProviderBinding:
  type: object
  description: >-
    Internal immutable binding for reconciliation; never return to candidate clients.
  additionalProperties: false
  required:
    - paymentSessionId
    - provider
    - configurationVersion
    - providerSessionReference
  properties:
    paymentSessionId:
      type: string
      format: uuid
    provider:
      $ref: "#/PaymentGatewayProvider"
    configurationVersion:
      type: string
    providerSessionReference:
      type: string

PaymentGatewayEvent:
  type: object
  additionalProperties: false
  required:
    - provider
    - providerEventId
    - paymentSessionId
    - status
    - amount
    - currency
    - occurredAt
  properties:
    provider:
      $ref: "#/PaymentGatewayProvider"
    providerEventId:
      type: string
      description: Stable provider event identifier, scoped to the provider.
    providerTransactionId:
      type: string
      description: Provider transaction reference for reconciliation; never a payment
        credential.
    paymentSessionId:
      type: string
      description: Platform payment-session ID resolved by the adapter.
      format: uuid
    status:
      type: string
      enum:
        - PAID
        - FAILED
        - CANCELLED
    amount:
      type: number
      exclusiveMinimum: 0
    currency:
      const: AED
    occurredAt:
      type: string
      format: date-time
    receiptId:
      type: string

WorkflowStatus:
  type: string
  description: >-
    Status vocabulary returned by generic workflow actions and work queues. Resource-specific
    endpoints remain authoritative for valid transitions.
  enum:
    - DRAFT
    - SUBMITTED
    - UNDER_REVIEW
    - PENDING
    - IN_PROGRESS
    - CORRECTION_REQUIRED
    - CORRECTION_SUBMITTED
    - PENDING_CLARIFICATION
    - CLARIFICATION_SUBMITTED
    - SCREEN_OUT_PENDING_APPROVAL
    - RE_EVALUATING
    - COMPLETE
    - SCREENED_OUT
    - REVIEW_COMPLETED
    - THIRD_REFEREE_REQUIRED
    - THIRD_ROUND_IN_PROGRESS
    - SECOND_EVALUATION_REQUIRED
    - SECOND_EVALUATION_IN_PROGRESS
    - ON_HOLD
    - READY_FOR_INITIAL_ANNOUNCEMENT
    - ANNOUNCED
    - APPEAL_UNDER_REVIEW
    - READY_FOR_REANNOUNCEMENT
    - REANNOUNCED
    - WITHDRAWN
    - ARCHIVED
    - PAID
    - FAILED
    - CANCELLED
    - UNKNOWN

PreferenceInput:
  type: object
  additionalProperties: false
  required:
    - specialtyId
    - preferenceOrder
    - trainingSites
  properties:
    specialtyId:
      type: string
      format: uuid
    preferenceOrder:
      type: integer
      minimum: 1
      maximum: 2
    trainingSites:
      type: array
      minItems: 1
      items:
        $ref: "#/TrainingSitePreferenceInput"

TrainingSitePreferenceInput:
  type: object
  additionalProperties: false
  required:
    - siteId
    - siteOrder
  properties:
    siteId:
      type: string
      format: uuid
    siteOrder:
      type: integer
      minimum: 1

ApplicationSummary:
  type: object
  required:
    - id
    - applicationNumber
    - program
    - status
    - createdAt
    - version
  properties:
    id:
      type: string
      format: uuid
      description: Application UUID used in URLs.
    applicationNumber:
      $ref: "#/ApplicationNumber"
    program:
      $ref: "#/Program"
    status:
      $ref: "#/ApplicationStatus"
    createdAt:
      type: string
      format: date-time
    submittedAt:
      type:
        - string
        - "null"
      format: date-time
    version:
      type: integer
      minimum: 1
    preferences:
      type: array
      items:
        $ref: "#/PreferenceInput"
    announcedScores:
      oneOf:
        - $ref: "#/AnnouncedScores"
        - type: "null"
      description: Present only after the applicable official announcement.

Application:
  allOf:
    - $ref: "#/ApplicationSummary"
    - type: object
      properties:
        sections:
          type: object
          description: >-
            Extensible, program-configured draft sections. Only approved schema fields
            are accepted.
          additionalProperties: true

CreateApplicationRequest:
  type: object
  additionalProperties: false
  required:
    - programId
    - preferences
  properties:
    programId:
      type: string
      format: uuid
    preferences:
      type: array
      minItems: 1
      maxItems: 2
      items:
        $ref: "#/PreferenceInput"

UpdateDraftRequest:
  type: object
  description: >-
    JSON Merge Patch document. Only fields permitted by the current draft schema may
    be changed.
  minProperties: 1
  properties:
    preferences:
      type: array
      minItems: 1
      maxItems: 2
      items:
        $ref: "#/PreferenceInput"
    sections:
      type: object
      additionalProperties: true

Page:
  type: object
  additionalProperties: false
  required:
    - limit
    - nextCursor
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 100
    nextCursor:
      type:
        - string
        - "null"
      description: Opaque cursor for the next page; null means there is no next page.

ValidationIssue:
  type: object
  additionalProperties: false
  required:
    - code
    - detail
  properties:
    code:
      type: string
      example: field.required
    detail:
      type: string
      description: Safe, user-actionable message; must not contain confidential values.
    pointer:
      type: string
      description: JSON Pointer to the invalid request field where applicable.

Problem:
  type: object
  description: >-
    RFC 7807 Problem Details, returned at the top level with application/problem+json,
    never inside the success envelope (D-02). detail is localized and safe to show.
  required:
    - type
    - title
    - status
    - code
    - traceId
  properties:
    type:
      type: string
      format: uri-reference
      example: about:blank
    title:
      type: string
    status:
      type: integer
      minimum: 400
      maximum: 599
    detail:
      type: string
      description: Safe summary of the failure; never expose stack traces or sensitive
        data.
    instance:
      type: string
      format: uri-reference
    code:
      type: string
      pattern: ^[a-z]+(\.[a-z_]+)+$
      description: >-
        Stable, dotted business error code, e.g. account.not_registered, request.validation_failed,
        icp.preview_invalid. Clients branch on this, never on detail.
      example: account.not_registered
    errors:
      type: array
      items:
        $ref: "#/ValidationIssue"
    traceId:
      type: string
      description: W3C trace id shown to the user for support.

WorkflowActionRequest:
  type: object
  additionalProperties: false
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 500
    note:
      type:
        - string
        - "null"
      maxLength: 500
    justification:
      type:
        - string
        - "null"
      maxLength: 500

WorkflowActionResult:
  type: object
  additionalProperties: false
  required:
    - resourceId
    - status
    - effectiveAt
    - auditEventId
  properties:
    resourceId:
      type: string
      format: uuid
    status:
      $ref: "#/WorkflowStatus"
      description: Current authoritative workflow status after the action.
    effectiveAt:
      type: string
      format: date-time
    auditEventId:
      type: string
      format: uuid
    messageCode:
      type: string

ApplicationSection:
  type: object
  additionalProperties: false
  required:
    - applicationId
    - sectionKey
    - schemaVersion
    - values
    - fields
    - editable
    - version
  properties:
    applicationId:
      type: string
      format: uuid
    sectionKey:
      type: string
      enum:
        - application-information
        - personal-information
        - academic-information
        - english-proficiency
        - internship-information
        - residency-information
        - board-license-information
        - residency-entrance-exam
    values:
      type: object
      description: Candidate values keyed by the field code in the accompanying field
        definitions.
      additionalProperties: {}
    schemaVersion:
      type: string
      description: Immutable form schema version used to render and validate this
        section.
    fields:
      type: array
      items:
        $ref: "#/FormFieldDefinition"
    editable:
      type: boolean
    version:
      type: integer
      minimum: 1

ApplicationFormSchema:
  type: object
  additionalProperties: false
  required:
    - applicationId
    - schemaVersion
    - sections
  properties:
    applicationId:
      type: string
      format: uuid
    schemaVersion:
      type: string
    sections:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - sectionKey
          - fields
        properties:
          sectionKey:
            type: string
          fields:
            type: array
            items:
              $ref: "#/FormFieldDefinition"

FormFieldDefinition:
  type: object
  additionalProperties: false
  required:
    - fieldCode
    - label
    - dataType
    - visible
    - required
    - readOnly
  properties:
    fieldCode:
      type: string
    label:
      type: string
    dataType:
      type: string
      enum:
        - STRING
        - TEXT
        - INTEGER
        - DECIMAL
        - BOOLEAN
        - DATE
        - DATE_TIME
        - SINGLE_SELECT
        - MULTI_SELECT
        - FILE_REFERENCE
        - URL
    visible:
      type: boolean
    required:
      type: boolean
    readOnly:
      type: boolean
    constraints:
      $ref: "#/FieldConstraints"
    options:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - code
          - label
        properties:
          code:
            type: string
          label:
            type: string
    dependsOn:
      type: array
      items:
        type: string
    visibleWhen:
      description: When present, all conditions must match for this field to be shown.
      type: array
      items:
        $ref: "#/FormCondition"
    requiredWhen:
      description: When present, all conditions must match for this field to be required.
      type: array
      items:
        $ref: "#/FormCondition"

FieldConstraints:
  type: object
  additionalProperties: false
  properties:
    minLength:
      type: integer
      minimum: 0
    maxLength:
      type: integer
      minimum: 0
    minimum:
      type: number
    maximum:
      type: number
    multipleOf:
      type: number
      exclusiveMinimum: 0
    pattern:
      type: string
    format:
      type: string
    allowedFileTypes:
      type: array
      items:
        type: string
    maxFileSizeBytes:
      type: integer
      minimum: 1

FormCondition:
  type: object
  additionalProperties: false
  required:
    - fieldCode
    - operator
  properties:
    fieldCode:
      type: string
    operator:
      type: string
      enum:
        - EQ
        - NE
        - IN
        - NOT_IN
        - GT
        - GTE
        - LT
        - LTE
        - NOT_EMPTY
        - EMPTY
    value: {}

ApplicationSectionInput:
  type: object
  additionalProperties: false
  required:
    - schemaVersion
    - values
  properties:
    schemaVersion:
      type: string
      description: Must match the currently applicable form schema version.
    values:
      type: object
      description: Only field codes defined in the schema version are accepted.
      additionalProperties: {}

PortfolioSubmission:
  type: object
  additionalProperties: false
  required:
    - submittedAt
    - immutable
    - answers
  properties:
    submittedAt:
      type: string
      format: date-time
    immutable:
      const: true
    answers:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - questionId
          - answer
        properties:
          questionId:
            type: string
            format: uuid
          answer:
            type: string
            enum:
              - "YES"
              - "NO"
          details:
            type: object
            additionalProperties: true
          evidenceIds:
            type: array
            items:
              type: string

PortfolioSubmissionInput:
  type: object
  additionalProperties: false
  required:
    - answers
    - confirmed
  properties:
    answers:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - questionId
          - answer
        properties:
          questionId:
            type: string
            format: uuid
          answer:
            type: string
            enum:
              - "YES"
              - "NO"
          details:
            type: object
            additionalProperties: true
          evidenceIds:
            type: array
            items:
              type: string
    confirmed:
      const: true

PaymentSession:
  type: object
  additionalProperties: false
  required:
    - id
    - applicationId
    - amount
    - currency
    - status
  properties:
    id:
      type: string
    applicationId:
      type: string
      format: uuid
    amount:
      type: number
      exclusiveMinimum: 0
    currency:
      const: AED
    status:
      $ref: "#/PaymentStatus"
    checkoutUrl:
      type:
        - string
        - "null"
      format: uri
      description: >-
        Provider-hosted checkout URL returned through the normalized adapter. The
        client must treat it as opaque and must not infer the gateway.
    checkoutExpiresAt:
      type:
        - string
        - "null"
      format: date-time
    receiptId:
      type:
        - string
        - "null"
    paymentDate:
      type:
        - string
        - "null"
      format: date-time

PaymentRecord:
  type: object
  additionalProperties: false
  required:
    - applicationId
    - applicationNumber
    - program
    - feeType
    - billStatus
    - billAmount
  properties:
    applicationId:
      type: string
      format: uuid
    applicationNumber:
      $ref: "#/ApplicationNumber"
    candidateDisplayName:
      type: string
    email:
      type: string
      format: email
    program:
      type: string
    feeType:
      type: string
    billStatus:
      type: string
      enum:
        - NA
        - PENDING
        - PAID
        - FAILED
    billAmount:
      type: number
      minimum: 0
    paymentDate:
      type:
        - string
        - "null"
      format: date-time

WorkItem:
  type: object
  additionalProperties: false
  required:
    - id
    - status
    - createdAt
  properties:
    id:
      type: string
    applicationId:
      type: string
      format: uuid
    applicationNumber:
      $ref: "#/ApplicationNumber"
    portfolioId:
      type: string
      format: uuid
    program:
      type: string
    specialty:
      type: string
    status:
      $ref: "#/WorkflowStatus"
    submittedAt:
      type:
        - string
        - "null"
      format: date-time
    retrievedAt:
      type:
        - string
        - "null"
      format: date-time
    dueAt:
      type:
        - string
        - "null"
      format: date-time
    createdAt:
      type: string
      format: date-time

CorrectionFlag:
  type: object
  additionalProperties: false
  required:
    - fieldPointer
    - candidateNoteCode
  properties:
    fieldPointer:
      type: string
      description: JSON Pointer to the field, attachment, section, or subsection flagged.
    candidateNoteCode:
      type: string
    candidateNote:
      type: string
      maxLength: 500

CorrectionFlagSet:
  type: object
  additionalProperties: false
  required:
    - flags
  properties:
    flags:
      type: array
      minItems: 1
      items:
        $ref: "#/CorrectionFlag"

OfficerDecision:
  type: object
  additionalProperties: false
  description: >-
    Supervisor decision on a recommended screen-out. A note is mandatory only for
    rejection; endorsement may change the screen-out reason. BRD: US-2.4.3, STP-2.4
    rule 3.
  required:
    - decision
  properties:
    decision:
      type: string
      enum:
        - ENDORSE_SCREEN_OUT
        - REJECT_SCREEN_OUT
    reasonCode:
      type:
        - string
        - "null"
      description: >-
        Screen-out reason from lookup SCREEN_OUT_REASON. On endorsement it replaces
        the officer's reason (US-2.4.3 AC2); when null the officer's reason is kept.
        Ignored on rejection.
    note:
      type:
        - string
        - "null"
      maxLength: 500
      description: Mandatory when decision is REJECT_SCREEN_OUT.
  allOf:
    - if:
        required:
          - decision
        properties:
          decision:
            const: REJECT_SCREEN_OUT
      then:
        required:
          - note
        properties:
          note:
            type: string
            minLength: 1

AssignmentRequest:
  type: object
  additionalProperties: false
  required:
    - targetUserId
    - justification
  properties:
    targetUserId:
      type: string
      format: uuid
    justification:
      type: string
      minLength: 1
      maxLength: 200

ScoreInput:
  type: object
  additionalProperties: false
  description: >-
    The referee's decision on one question for the active round. The service computes
    the question score: all-or-nothing questions award full points on ACCEPT; points-system
    questions award the points mapped to the classification; REJECT always awards
    zero. BRD: US-3.3.3.
  required:
    - questionId
    - decision
  properties:
    questionId:
      type: string
      format: uuid
    decision:
      type: string
      enum:
        - ACCEPT
        - REJECT
    classificationCode:
      type:
        - string
        - "null"
      description: >-
        Required when decision is ACCEPT and the question uses the points system;
        otherwise null. Codes come from lookup PORTFOLIO_CLASSIFICATION for the question.
        A missing or unexpected classification returns 422.
    rejectionReasonCodes:
      type: array
      uniqueItems: true
      items:
        type: string
      description: >-
        One or more reasons, required when decision is REJECT and empty otherwise.
        Codes come from lookup PORTFOLIO_REJECTION_REASON for the question. The candidate-facing
        comment is the predefined comment mapped to each reason.
    questionScore:
      type:
        - number
        - "null"
      readOnly: true
      description: Points awarded for this question, computed by the service.
  allOf:
    - if:
        required:
          - decision
        properties:
          decision:
            const: REJECT
      then:
        required:
          - rejectionReasonCodes
        properties:
          rejectionReasonCodes:
            minItems: 1

ScoreSet:
  type: object
  additionalProperties: false
  required:
    - rubricVersion
    - scores
  properties:
    rubricVersion:
      type: string
    scores:
      type: array
      minItems: 1
      items:
        $ref: "#/ScoreInput"
    totalPoints:
      type:
        - number
        - "null"
      readOnly: true
      description: Total Portfolio Points for this referee's round, computed by the
        service.

ScoreSubmission:
  type: object
  additionalProperties: false
  required:
    - confirmed
  properties:
    confirmed:
      const: true

BulkActionRequest:
  type: object
  additionalProperties: false
  required:
    - applicationIds
    - reasonCode
    - confirmed
  properties:
    applicationIds:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
    reasonCode:
      type: string
    confirmed:
      const: true

BulkWorkflowResult:
  type: object
  additionalProperties: false
  required:
    - selectedCount
    - processedCount
    - blockedCount
    - results
  properties:
    selectedCount:
      type: integer
      minimum: 0
    processedCount:
      type: integer
      minimum: 0
    blockedCount:
      type: integer
      minimum: 0
    results:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - resourceId
          - outcome
        properties:
          resourceId:
            type: string
            format: uuid
          outcome:
            type: string
            enum:
              - PROCESSED
              - BLOCKED
          code:
            type: string

AnnouncedScores:
  type: object
  additionalProperties: false
  required:
    - announcedAt
    - finalPortfolioScore
    - shortlistingScore
  properties:
    announcedAt:
      type: string
      format: date-time
    finalPortfolioScore:
      type: number
    shortlistingScore:
      type: number
    gpaShortlistingScore:
      type:
        - number
        - "null"
      description: Null when the program does not use GPA.
    examShortlistingScore:
      type:
        - number
        - "null"
      description: Residency only; null otherwise.
    casperScore:
      type:
        - number
        - "null"
    appealDeadline:
      type:
        - string
        - "null"
      format: date-time
    reannouncedAt:
      type:
        - string
        - "null"
      format: date-time

AttachmentMetadata:
  type: object
  additionalProperties: false
  required:
    - attachmentId
    - version
    - fileName
    - mediaType
    - sizeBytes
    - uploadedAt
  properties:
    attachmentId:
      type: string
      format: uuid
    version:
      type: integer
      minimum: 1
    fileName:
      type: string
    mediaType:
      type: string
    sizeBytes:
      type: integer
      minimum: 0
    uploadedAt:
      type: string
      format: date-time

AttachmentSlot:
  type: object
  description: >-
    One document required, optional, or permitted for this application under its current
    form schema and answers. Slots are generated by the server (for example, one personal-statement
    slot per selected specialty and training site) and change when preferences or
    conditional answers change. Hidden documents are not returned.
  additionalProperties: false
  required:
    - slotId
    - sectionKey
    - documentTypeCode
    - label
    - required
    - editable
    - allowedMediaTypes
    - maxFileSizeBytes
    - attachment
  properties:
    slotId:
      type: string
      description: Opaque slot identifier used in upload, delete, and download paths.
    sectionKey:
      type: string
      description: Application section, or `portfolio`, that displays this slot.
    documentTypeCode:
      type: string
      description: Stable configured document type, for example CV or PERSONAL_STATEMENT.
      example: PERSONAL_STATEMENT
    label:
      type: string
    required:
      type: boolean
      description: Whether a file must be present before payment and submission.
    editable:
      type: boolean
      description: >-
        Whether the caller may upload or delete now. True for draft slots, only flagged
        slots while correction is required, and portfolio evidence until the portfolio
        is submitted.
    allowedMediaTypes:
      type: array
      minItems: 1
      items:
        type: string
      example:
        - application/pdf
    maxFileSizeBytes:
      type: integer
      minimum: 1
      example: 2097152
    specialtyId:
      type:
        - string
        - "null"
      description: Set for documents required per specialty preference.
      format: uuid
    trainingSiteId:
      type:
        - string
        - "null"
      description: Set for documents required per specialty and training site.
      format: uuid
    portfolioQuestionId:
      type:
        - string
        - "null"
      description: Set for portfolio evidence slots.
      format: uuid
    attachment:
      description: Current active file, or null when nothing has been uploaded.
      oneOf:
        - $ref: "#/AttachmentMetadata"
        - type: "null"

PortfolioReview:
  type: object
  additionalProperties: false
  required:
    - portfolioId
    - round
    - rubricVersion
    - questions
  properties:
    portfolioId:
      type: string
      format: uuid
    round:
      type: string
      enum:
        - ROUND_1
        - ROUND_2
        - ROUND_3
        - SECOND_EVALUATION
    rubricVersion:
      type: string
    questions:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - questionId
          - prompt
          - candidateAnswer
          - evidence
        properties:
          questionId:
            type: string
            format: uuid
          prompt:
            type: string
          candidateAnswer:
            type: string
          details:
            type: object
            additionalProperties: true
          evidence:
            type: array
            items:
              $ref: "#/AttachmentMetadata"
          priorRoundData:
            description: Included only for roles/rounds explicitly authorized to see
              it.
            type:
              - object
              - "null"
            additionalProperties: true

SeniorPortfolioReview:
  allOf:
    - $ref: "#/PortfolioReview"
    - type: object
      required:
        - roundSummaries
      properties:
        roundSummaries:
          type: array
          items:
            type: object
            required:
              - round
              - status
            properties:
              round:
                type: string
                enum:
                  - ROUND_1
                  - ROUND_2
                  - ROUND_3
                  - SECOND_EVALUATION
              status:
                $ref: "#/PortfolioRoundStatus"
              refereeId:
                type: string
                format: uuid
              totalPoints:
                type:
                  - number
                  - "null"
              submittedAt:
                type:
                  - string
                  - "null"
                format: date-time
        discrepancies:
          type: array
          items:
            type: object
            required:
              - questionId
            properties:
              questionId:
                type: string
                format: uuid
              round1Result:
                type: string
              round2Result:
                type: string

PortfolioScoringResult:
  type: object
  additionalProperties: false
  required:
    - portfolioId
    - roundStatus
    - portfolioStatus
    - auditEventId
  properties:
    portfolioId:
      type: string
      format: uuid
    roundStatus:
      $ref: "#/PortfolioRoundStatus"
    portfolioStatus:
      $ref: "#/PortfolioStatus"
    discrepancy:
      type: boolean
    discrepancyDetails:
      type: array
      items:
        type: object
        required:
          - questionId
          - round1Result
          - round2Result
        properties:
          questionId:
            type: string
            format: uuid
          round1Result:
            type: string
          round2Result:
            type: string
    finalPortfolioPoints:
      type:
        - number
        - "null"
    weightedPortfolioScore:
      type:
        - number
        - "null"
    auditEventId:
      type: string
      format: uuid

CasperImportResult:
  type: object
  additionalProperties: false
  required:
    - uploadVersion
    - totalRows
    - appliedRows
    - exceptionRows
  properties:
    uploadVersion:
      type: integer
      minimum: 1
    totalRows:
      type: integer
      minimum: 0
    matchedRows:
      type: integer
      minimum: 0
    appliedRows:
      type: integer
      minimum: 0
    exceptionRows:
      type: integer
      minimum: 0
    exceptions:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - rowNumber
          - code
        properties:
          rowNumber:
            type: integer
            minimum: 1
          code:
            type: string
          detail:
            type: string
          applicationNumberReceived:
            type:
              - string
              - "null"
            description: Value as received in the file, before normalisation to digits.

InterviewNotSpecified:
  description: >-
    Reserved as a documentation marker only. No interview API is defined by the supplied
    BRD.
  type: object

LookupItem:
  type: object
  additionalProperties: false
  required:
    - code
    - label
    - active
  properties:
    code:
      type: string
      description: Stable machine code. Send and store this value, never the label.
    label:
      type: string
      description: Display label.
    parentCode:
      type:
        - string
        - "null"
      description: >-
        Code this value belongs to, for example the portfolio question of a rejection
        reason. Null when not scoped.
    candidateComment:
      type:
        - string
        - "null"
      description: >-
        Predefined candidate-facing comment mapped to a portfolio rejection reason.
        Null for other lookup types.
    points:
      type:
        - number
        - "null"
      description: Points of a portfolio classification. Null for other lookup types.
    sortOrder:
      type: integer
      minimum: 0
    active:
      type: boolean
      description: Inactive values are returned only to read historical records.

OtpDestination:
  type: object
  additionalProperties: false
  required:
    - channel
    - maskedValue
  properties:
    channel:
      type: string
      enum:
        - EMAIL
        - SMS
    maskedValue:
      type: string
      description: Masked address or number, for example a***@example.com.

OtpChallenge:
  type: object
  additionalProperties: false
  description: A one-time code was issued. The code itself is never returned.
  required:
    - expiresAt
    - resendAvailableAt
    - destinations
  properties:
    expiresAt:
      type: string
      format: date-time
      description: When the issued code stops being accepted.
    resendAvailableAt:
      type: string
      format: date-time
      description: Earliest time a new code can be requested (resend cooldown).
    destinations:
      type: array
      minItems: 1
      items:
        $ref: "#/OtpDestination"

ContactVerification:
  type: object
  additionalProperties: false
  required:
    - verificationId
    - channel
    - expiresAt
    - resendAvailableAt
    - destination
  properties:
    verificationId:
      type: string
      format: uuid
    channel:
      type: string
      enum:
        - EMAIL
        - SMS
    destination:
      $ref: "#/OtpDestination"
    expiresAt:
      type: string
      format: date-time
    resendAvailableAt:
      type: string
      format: date-time

ContactVerificationResult:
  type: object
  additionalProperties: false
  required:
    - verificationId
    - channel
    - verifiedAt
    - validUntil
  properties:
    verificationId:
      type: string
      format: uuid
    channel:
      type: string
      enum:
        - EMAIL
        - SMS
    verifiedAt:
      type: string
      format: date-time
    validUntil:
      type: string
      format: date-time
      description: >-
        The personal-information section must be saved with the verified value before
        this time; afterwards a new verification is required.

CandidateApplicationAction:
  type: string
  description: >-
    Actions the candidate may take now, evaluated by the service (US-1.2.1 data dictionary).
  enum:
    - VIEW
    - RESUME
    - DISCARD
    - WITHDRAW
    - REINSTATE
    - EDIT_PREFERENCES
    - EXCLUDE_TRAINING_SITE
    - APPEAL

CandidateDashboardItem:
  allOf:
    - $ref: "#/ApplicationSummary"
    - type: object
      required:
        - allowedActions
      properties:
        submissionDeadline:
          type:
            - string
            - "null"
          format: date-time
          description: Program deadline for the application's cycle.
        announcementDate:
          type:
            - string
            - "null"
          format: date-time
          description: Initial announcement or latest reannouncement date; null before
            announcement.
        appealDeadline:
          type:
            - string
            - "null"
          format: date-time
          description: Shown only while the appeal window is open.
        allowedActions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/CandidateApplicationAction"

CandidateDashboard:
  type: object
  additionalProperties: false
  required:
    - startNewApplication
    - items
    - page
  properties:
    startNewApplication:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        disabledReason:
          type:
            - string
            - "null"
          enum:
            - ACTIVE_APPLICATION_EXISTS
            - NO_OPEN_PROGRAM
            - null
          description: Why Start New Application is disabled (US-1.2.1 AC4-AC6).
        nextCycleOpensAt:
          type:
            - string
            - "null"
          format: date-time
          description: Shown with NO_OPEN_PROGRAM when a future opening date is configured.
    sessionTimeoutMinutes:
      type: integer
      minimum: 1
      description: Inactivity time-out shown to the candidate (US-1.2.1 note 3).
    items:
      type: array
      items:
        $ref: "#/CandidateDashboardItem"
    page:
      $ref: "#/Page"

CandidatePortfolioResult:
  type: object
  additionalProperties: false
  required:
    - applicationId
    - applicationNumber
    - announcedAt
    - finalPortfolioPoints
    - portfolioScore
    - appeal
    - questions
  properties:
    applicationId:
      type: string
      format: uuid
    applicationNumber:
      $ref: "#/ApplicationNumber"
    announcedAt:
      type: string
      format: date-time
    finalPortfolioPoints:
      type: number
      description: Final-round result only; internal round scores are never returned.
    portfolioScore:
      type: number
      description: Weighted portfolio score.
    appeal:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - OPEN
            - SUBMITTED
            - CLOSED
            - NOT_AVAILABLE
        deadline:
          type:
            - string
            - "null"
          format: date-time
        submittedAt:
          type:
            - string
            - "null"
          format: date-time
        timeZoneId:
          type:
            - string
            - "null"
          description: IANA time zone the appeal window is defined in.
    questions:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - questionId
          - prompt
          - candidateAnswer
          - maxPoints
          - awardedPoints
          - comments
          - appealable
        properties:
          questionId:
            type: string
            format: uuid
          prompt:
            type: string
          candidateAnswer:
            type: string
            enum:
              - "YES"
              - "NO"
          details:
            type: object
            additionalProperties: true
          evidence:
            type: array
            items:
              $ref: "#/AttachmentMetadata"
          maxPoints:
            type: number
          awardedPoints:
            type: number
          comments:
            type: array
            items:
              type: string
            description: >-
              Predefined candidate-facing comments mapped to the final round's rejection
              reasons.
          appealable:
            type: boolean
            description: >-
              True only while the appeal is OPEN for a question answered YES that
              did not receive full points.
          appealResponse:
            type:
              - string
              - "null"
            maxLength: 200
            description: The candidate's submitted response; null before an appeal.

DuplicateAccountParty:
  type: object
  additionalProperties: false
  required:
    - candidateId
    - candidateNumber
    - displayName
    - createdAt
  properties:
    candidateId:
      type: string
      format: uuid
    candidateNumber:
      $ref: "#/CandidateNumber"
    displayName:
      type: string
    createdAt:
      type: string
      format: date-time

DuplicateAccountPair:
  type: object
  additionalProperties: false
  required:
    - pairId
    - detectedAt
    - matchedOn
    - original
    - duplicate
  properties:
    pairId:
      type: string
      format: uuid
    detectedAt:
      type: string
      format: date-time
    matchedOn:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum:
          - MOBILE
          - EMIRATES_ID
          - PASSPORT
      description: Attributes that matched. The matched values themselves are never
        returned.
    original:
      $ref: "#/DuplicateAccountParty"
    duplicate:
      $ref: "#/DuplicateAccountParty"

StaffUserSummary:
  type: object
  additionalProperties: false
  required:
    - userId
    - displayName
  properties:
    userId:
      type: string
      format: uuid
    displayName:
      type: string
    activeAssignments:
      type: integer
      minimum: 0

BulkReassignmentRequest:
  type: object
  additionalProperties: false
  description: >-
    Supervisor reassigns or returns one or more applications (US-2.2.3). Each application
    is validated on its own; ineligible ones are reported as BLOCKED.
  required:
    - action
    - applicationIds
    - justification
    - confirmed
  properties:
    action:
      type: string
      enum:
        - REASSIGN
        - RETURN_TO_POOL
    applicationIds:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items:
        type: string
    targetOfficerId:
      type:
        - string
        - "null"
      description: Required for REASSIGN; must be an officer of the same pool.
      format: uuid
    justification:
      type: string
      minLength: 1
      maxLength: 200
    confirmed:
      const: true
  allOf:
    - if:
        required:
          - action
        properties:
          action:
            const: REASSIGN
      then:
        required:
          - targetOfficerId
        properties:
          targetOfficerId:
            type: string
            minLength: 1
            format: uuid

ApplicationAttachment:
  type: object
  additionalProperties: false
  description: >-
    An active application attachment. Training sites and portfolio evidence are never
    included for admission staff.
  required:
    - sectionKey
    - documentTypeCode
    - label
    - attachment
    - previousVersionCount
  properties:
    sectionKey:
      type: string
    documentTypeCode:
      type: string
    label:
      type: string
    specialtyId:
      type:
        - string
        - "null"
      format: uuid
    attachment:
      $ref: "#/AttachmentMetadata"
    previousVersionCount:
      type: integer
      minimum: 0
      description: Replaced versions kept for audit.

ReinstatementRequestStatus:
  type: string
  enum:
    - SUBMITTED
    - APPROVED
    - REJECTED

ReinstatementRequestSummary:
  type: object
  required:
    - requestId
    - applicationId
    - applicationNumber
    - candidateName
    - programName
    - cycleId
    - requestedAt
    - status
  properties:
    requestId:
      type: string
      format: uuid
    applicationId:
      type: string
      format: uuid
    applicationNumber:
      $ref: "#/ApplicationNumber"
    candidateName:
      type: string
    programName:
      type: string
    cycleId:
      type: string
      format: uuid
    requestedAt:
      type: string
      format: date-time
    status:
      $ref: "#/ReinstatementRequestStatus"

ReinstatementRequestDetail:
  allOf:
    - $ref: "#/ReinstatementRequestSummary"
    - type: object
      required:
        - withdrawalReasonCode
        - withdrawnAt
        - justification
        - previousStatus
        - notes
      properties:
        withdrawalReasonCode:
          type: string
        withdrawalOtherReason:
          type:
            - string
            - "null"
        withdrawnAt:
          type: string
          format: date-time
        justification:
          type: string
          description: The candidate's reinstatement justification.
        previousStatus:
          type: object
          additionalProperties: false
          description: Statuses before withdrawal; restored on approval.
          required:
            - applicationStatus
          properties:
            applicationStatus:
              $ref: "#/ApplicationStatus"
            verificationStatus:
              oneOf:
                - $ref: "#/VerificationStatus"
                - type: "null"
            portfolioStatus:
              oneOf:
                - $ref: "#/PortfolioStatus"
                - type: "null"
        notes:
          type: array
          description: Staff notes recorded before the withdrawal (US-2.5.1 note 2).
          items:
            type: object
            additionalProperties: false
            required:
              - noteType
              - text
              - createdAt
            properties:
              noteType:
                type: string
                enum:
                  - CORRECTION
                  - ESCALATION
                  - SCREEN_OUT
                  - SUPERVISOR_GUIDANCE
              text:
                type: string
              createdAt:
                type: string
                format: date-time
              authorDisplayName:
                type: string
        decision:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - decision
                - note
                - decidedAt
              properties:
                decision:
                  type: string
                  enum:
                    - APPROVE
                    - REJECT
                reasonCode:
                  type:
                    - string
                    - "null"
                note:
                  type: string
                decidedAt:
                  type: string
                  format: date-time
                decidedByDisplayName:
                  type: string
            - type: "null"

IcpFieldComparison:
  type: object
  additionalProperties: false
  required:
    - fieldCode
    - label
    - currentValue
    - icpValue
    - differs
  properties:
    fieldCode:
      type: string
    label:
      type: string
    currentValue:
      type:
        - string
        - "null"
      description: Value stored on the application now.
    icpValue:
      type:
        - string
        - "null"
      description: Latest value returned by ICP.
    differs:
      type: boolean

ScoreOverrideRequest:
  type: object
  additionalProperties: false
  required:
    - round
    - newTotalPoints
    - justification
    - confirmed
  properties:
    round:
      type: string
      enum:
        - ROUND_1
        - ROUND_2
        - ROUND_3
        - SECOND_EVALUATION
    newTotalPoints:
      type: number
      minimum: 0
      description: New total for the round, at most the question set total (X out
        of Y).
    justification:
      type: string
      minLength: 1
      maxLength: 200
    confirmed:
      const: true

VerificationPoolInsights:
  type: object
  additionalProperties: false
  description: >-
    Pool insights for the caller's pools (summed across pools), or all pools for supervisors
    and the Central Monitor.
  required:
    - submitted
    - underVerification
    - pendingWithCandidate
    - screenedOut
    - completed
  properties:
    submitted:
      type: integer
      minimum: 0
      description: Verification status Pending (still in the pool).
    underVerification:
      type: integer
      minimum: 0
      description: In Progress, Clarification Submitted, Re-evaluating, Correction
        Submitted.
    pendingWithCandidate:
      type: integer
      minimum: 0
      description: Correction Required.
    screenedOut:
      type: integer
      minimum: 0
      description: Screen Out Pending Approval and Screened Out.
    completed:
      type: integer
      minimum: 0
      description: Complete.

OfficerQueueInsights:
  type: object
  additionalProperties: false
  required:
    - inProgress
    - pendingResponse
    - pendingWithSupervisor
    - resubmittedByCandidate
    - resubmittedBySupervisor
    - completed
    - screenedOut
    - autoReturnedToPool
  properties:
    inProgress:
      type: integer
      minimum: 0
    pendingResponse:
      type: integer
      minimum: 0
      description: Correction Required.
    pendingWithSupervisor:
      type: integer
      minimum: 0
      description: Pending Clarification and Screen Out Pending Approval.
    resubmittedByCandidate:
      type: integer
      minimum: 0
      description: Correction Submitted.
    resubmittedBySupervisor:
      type: integer
      minimum: 0
      description: Clarification Submitted and Re-evaluating.
    completed:
      type: integer
      minimum: 0
    screenedOut:
      type: integer
      minimum: 0
    autoReturnedToPool:
      type: integer
      minimum: 0
      description: Went from In Progress back to Pending after the due date.

OfficerInsight:
  type: string
  description: Personal-queue insight category used to filter the inbox (US-2.1.2
    AC10).
  enum:
    - IN_PROGRESS
    - PENDING_RESPONSE
    - PENDING_WITH_SUPERVISOR
    - RESUBMITTED_BY_CANDIDATE
    - RESUBMITTED_BY_SUPERVISOR
    - COMPLETED
    - SCREENED_OUT
    - AUTO_RETURNED_TO_POOL

VerificationInboxItem:
  type: object
  additionalProperties: false
  required:
    - applicationId
    - applicationNumber
    - candidateName
    - programName
    - poolId
    - applicationStatus
    - verificationStatus
  properties:
    applicationId:
      type: string
      format: uuid
    applicationNumber:
      $ref: "#/ApplicationNumber"
    candidateName:
      type: string
    programName:
      type: string
    specialtyName:
      type: string
      description: First-preference specialty (pool). Training sites are never included.
    poolId:
      type: string
      format: uuid
    assignedOfficerId:
      type:
        - string
        - "null"
      format: uuid
    submittedAt:
      type:
        - string
        - "null"
      format: date-time
    retrievedAt:
      type:
        - string
        - "null"
      format: date-time
    dueAt:
      type:
        - string
        - "null"
      format: date-time
    overdue:
      type: boolean
      description: Due date passed while verification is still In Progress.
    applicationStatus:
      $ref: "#/ApplicationStatus"
    verificationStatus:
      $ref: "#/VerificationStatus"
    portfolioStatus:
      $ref: "#/PortfolioStatus"
    gpaShortlistingScore:
      type:
        - number
        - "null"
    examShortlistingScore:
      type:
        - number
        - "null"
      description: Residency only.

OfficerDashboard:
  type: object
  additionalProperties: false
  required:
    - poolInsights
    - queueInsights
    - items
    - page
    - generatedAt
  properties:
    poolInsights:
      $ref: "#/VerificationPoolInsights"
    queueInsights:
      $ref: "#/OfficerQueueInsights"
    items:
      type: array
      items:
        $ref: "#/VerificationInboxItem"
    page:
      $ref: "#/Page"
    generatedAt:
