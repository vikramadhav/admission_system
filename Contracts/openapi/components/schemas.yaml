      type: array
      items:
        $ref: "#/ScreeningApplicationRow"
    page:
      $ref: "#/Page"
    generatedAt:
      type: string
      format: date-time

ApplicationNumber:
  type: string
  pattern: ^[1-9][0-9]{10}$
  example: "20270000001"
  description: >-
    Human-readable application number shown as "Application ID": cycle start year
    plus a 7-digit counter that restarts each cycle (D-19). Used in searches, emails,
    exports and as the CASPER matching key. Never used in URLs; resources are addressed
    by UUID.

CandidateNumber:
  type: string
  pattern: ^[0-9]{9}$
  example: "000000123"
  description: >-
    Human-readable 9-digit candidate number starting at 000000001, always text with
    leading zeros (D-05, D-13). Display only; candidates are addressed by UUID.

ApiResponse:
  type: object
  description: >-
    Success envelope for every JSON success response (engineering standard s.12, D-02).
    Errors are never wrapped: they are top-level Problem documents. File downloads
    are not wrapped.
  required:
    - data
  properties:
    data:
      description: Typed payload; each operation narrows it.
    messageCode:
      type:
        - string
        - "null"
      pattern: ^[a-z]+(\.[a-z_]+)+$
      example: applications.none_active
      description: Stable message code, set for an empty collection.
    message:
      type:
        - string
        - "null"
      description: messageCode resolved for the request culture.

ApiListResponse:
  description: >-
    Success envelope for collections: data is the page of items and pagination carries
    the cursor. An empty collection is 200 with data=[] and a messageCode.
  allOf:
    - $ref: "#/ApiResponse"
    - type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
        pagination:
          $ref: "#/Page"

StaffRoleCode:
  type: string
  enum:
    - ADMINISTRATOR
    - ADMISSION_OFFICER
    - ADMISSION_SUPERVISOR
    - CENTRAL_MONITOR
    - FINANCE_OFFICER
    - REFEREE
    - THIRD_REFEREE
    - SECOND_EVALUATION_REFEREE
    - SENIOR_REFEREE
  description: >-
    Internal staff roles held in the DAHC database. IDAM role, group or entitlement
    claims are never used.

UserPreferences:
  type: object
  additionalProperties: false
  required:
    - timeZoneId
    - culture
  properties:
    timeZoneId:
      type: string
      example: Asia/Dubai
      description: IANA time zone id.
    culture:
      type: string
      enum:
        - en-AE
        - ar-AE

AuthSession:
  type: object
  additionalProperties: false
  description: >-
    The signed-in user as known to DAHC. Candidates and staff are separate records
    (D-04).
  required:
    - userType
    - userId
    - displayName
    - roles
    - activeRole
    - preferences
  properties:
    userType:
      type: string
      enum:
        - CANDIDATE
        - STAFF
    userId:
      type: string
      format: uuid
    candidateNumber:
      oneOf:
        - $ref: "#/CandidateNumber"
        - type: "null"
      description: Candidates only.
    displayName:
      type: string
    email:
      type:
        - string
        - "null"
      format: email
    roles:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
      description: CANDIDATE alone, or one or more StaffRoleCode values.
    activeRole:
      type: string
      description: Role used for authorization on every request.
    preferences:
      $ref: "#/UserPreferences"

StaffRoleAssignment:
  type: object
  additionalProperties: false
  required:
    - roleCode
  properties:
    roleCode:
      $ref: "#/StaffRoleCode"
    programId:
      type:
        - string
        - "null"
      format: uuid
      description: Null means all programs.
    specialtyId:
      type:
        - string
        - "null"
      format: uuid
      description: Null means all specialties of the program.
    poolIds:
      type: array
      uniqueItems: true
      items:
        type: string
        format: uuid
      description: Work pools the user retrieves from (officers and referees).
    validFrom:
      type:
        - string
        - "null"
      format: date
    validTo:
      type:
        - string
        - "null"
      format: date

StaffUserInput:
  type: object
  additionalProperties: false
  required:
    - idamUserId
    - displayName
    - email
    - roles
  properties:
    idamUserId:
      type: string
      minLength: 1
      maxLength: 200
      description: IDAM immutable user identifier; the only match key at sign-in.
    displayName:
      type: string
      minLength: 1
      maxLength: 200
    email:
      type: string
      format: email
      maxLength: 320
    linkedCandidateId:
      type:
        - string
        - "null"
      format: uuid
      description: Candidate UUID of the same person, if they are or were a candidate
        (D-14).
    roles:
      type: array
      minItems: 1
      items:
        $ref: "#/StaffRoleAssignment"

StaffUser:
  type: object
  additionalProperties: false
  required:
    - staffUserId
    - displayName
    - email
    - isActive
    - roles
    - activeRole
    - version
  properties:
    staffUserId:
      type: string
      format: uuid
    displayName:
      type: string
    email:
      type: string
      format: email
    isActive:
      type: boolean
    hasSignedIn:
      type: boolean
    linkedCandidateId:
      type:
        - string
        - "null"
      format: uuid
    roles:
      type: array
      items:
        $ref: "#/StaffRoleAssignment"
    activeRole:
      type:
        - string
        - "null"
    version:
      type: string
      description: Entity tag for If-Match.

IntegrationClientInput:
  type: object
  additionalProperties: false
  required:
    - idamClientId
    - name
    - isActive
    - permissions
  properties:
    idamClientId:
      type: string
      minLength: 1
      maxLength: 200
    name:
      type: string
      minLength: 1
      maxLength: 200
    isActive:
      type: boolean
    permissions:
      type: array
      uniqueItems: true
      items:
        type: string
        enum:
          - payments.events-write
      description: Internal integration permissions; extend only with an approved
        integration.

IntegrationClient:
  type: object
  additionalProperties: false
  required:
    - integrationClientId
    - idamClientId
    - name
    - isActive
    - permissions
    - version
  properties:
    integrationClientId:
      type: string
      format: uuid
    idamClientId:
      type: string
    name:
      type: string
    isActive:
      type: boolean
    permissions:
      type: array
      items:
        type: string
    version:
      type: string
