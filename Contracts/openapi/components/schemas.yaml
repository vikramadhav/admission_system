    candidateName:
      type: string
    programName:
      type: string
    applicationStatus:
      $ref: "#/ApplicationStatus"
    verificationStatus:
      $ref: "#/VerificationStatus"
    portfolioStatus:
      $ref: "#/PortfolioStatus"
    announcementStatus:
      $ref: "#/AnnouncementStatus"
    casperAttendance:
      type: string
