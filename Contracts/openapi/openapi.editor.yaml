  /api/v1/applications/{applicationId}/attachments/{slotId}:
    put:
      tags:
      - Applications
      operationId: uploadApplicationAttachment
      summary: Upload or replace the file in an attachment slot
      description: 'The browser sends the file to this API only; it never calls the document integration directly. The service checks ownership and slot editability, validates media type and size against the slot, scans for malware, and stores the file through the Rhapsody integration in FileNet using the approved naming convention. Success is returned only after storage is confirmed. A replaced file is kept as a prior version for audit. Portfolio evidence attachmentIds returned here are the evidenceIds used in portfolio submission. Success: 200 with the new active AttachmentMetadata. Empty: not applicable. Error: 404 missing or not owned, 409 slot not editable in the current state, 413 too large, 415 disallowed type, 422 rejected content such as an empty or infected file, 503 when the document integration is unavailable (slot unchanged), or standard Problem response. BRD: US-1.3.2 through US-1.3.10, US-2.3.4. Roles (active role): CANDIDATE.'
      security:
      - IdamBearer: []
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/AttachmentSlotId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File stored and set as the active attachment for the slot.
          content:
            application/json:
