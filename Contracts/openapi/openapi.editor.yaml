    ApplicationNumber:
      type: string
      pattern: ^[1-9][0-9]{10}$
      example: '20270000001'
      description: 'Human-readable application number shown as "Application ID": cycle start year plus a 7-digit counter that restarts each cycle (D-19). Used in searches, emails, exports and as the CASPER matching key. Never used in URLs; resources are addressed by UUID.'
    CandidateNumber:
      type: string
      pattern: ^[0-9]{9}$
      example: '000000123'
      description: Human-readable 9-digit candidate number starting at 000000001, always text with leading zeros (D-05, D-13). Display only; candidates are addressed by UUID.
    ApiResponse:
      type: object
      description: 'Success envelope for every JSON success response (engineering standard s.12, D-02). Errors are never wrapped: they are top-level Problem documents. File downloads are not wrapped.'
      required:
      - data
      properties:
        data:
          description: Typed payload; each operation narrows it.
        messageCode:
          type:
          - string
          - 'null'
          pattern: ^[a-z]+(\.[a-z_]+)+$
          example: applications.none_active
          description: Stable message code, set for an empty collection.
        message:
          type:
          - string
          - 'null'
          description: messageCode resolved for the request culture.
    ApiListResponse:
      description: 'Success envelope for collections: data is the page of items and pagination carries the cursor. An empty collection is 200 with data=[] and a messageCode.'
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        required:
        - data
        - pagination
        properties:
          data:
            type: array
          pagination:
            $ref: '#/components/schemas/Page'
    StaffRoleCode:
      type: string
      enum:
      - ADMINISTRATOR
      - ADMISSION_OFFICER
      - ADMISSION_SUPERVISOR
      - CENTRAL_MONITOR
      - FINANCE_OFFICER
      - REFEREE
      - THIRD_REFEREE
      - SECOND_EVALUATION_REFEREE
      - SENIOR_REFEREE
      description: Internal staff roles held in the DAHC database. IDAM role, group or entitlement claims are never used.
    UserPreferences:
      type: object
      additionalProperties: false
      required:
