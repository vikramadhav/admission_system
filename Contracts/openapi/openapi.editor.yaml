openapi: 3.1.0
info:
  title: MBRU Unified Admission Platform API
  version: 0.10.0
  summary: Modular API contract covering GME Release 5 user stories.
  description: Contract for the GME Release 5 user stories, aligned with the DAHC engineering standard (decisions D-01 to D-21 in Open-Questions.md). Success responses use the ApiResponse envelope; errors are top-level RFC 7807 Problem documents with dotted codes. Callers send an IDAM access token; authorization uses the internal active role listed in each operation (x-dahc-roles), never OAuth scopes. Resources are addressed by UUID; candidate and application numbers are display fields. Coverage does not mean unresolved business rules are approved or that the APIs are implemented. Not an MBBS or interview API.
  contact:
    name: Admission Platform API Contract Owners
servers:
- url: /
  description: Relative to the API host configured for the environment. Paths start with /api/v1.
security:
- IdamBearer: []
tags:
- name: Identity
- name: Administration
- name: Catalog
- name: Applications
- name: Candidate Lifecycle
- name: Payments
- name: Admission Operations
- name: Portfolio Scoring
- name: Screening and Announcements
externalDocs:
  description: Shared API conventions, authentication decisions, and implementation guidance.
  url: ../decisions.md
paths:
  /api/v1/auth/sign-in:
    post:
      tags:
      - Identity
      operationId: signIn
      summary: 'Sign in: provision a candidate or match a pre-registered staff user'
      description: 'Called by the client after IDAM sign-in. The API validates the opaque access token by introspection, calls IDAM UserInfo itself and refreshes the stored profile attributes. An unknown identity becomes a Candidate (Candidate role only); an identity pre-registered by an Administrator signs in as staff and no Candidate is created. The duplicate-account check runs here (BRD US-1.1.1): when the Emirates ID, passport or mobile from IDAM matches another candidate, the pair is recorded for supervisors and 409 account.duplicate tells the candidate to sign in with the original account. Identity, profile and role data are never accepted from the request. Success: 200 with the session (profile, roles, active role, preferences). Empty: not applicable. Error: 401 invalid token, 403 account.deactivated, 409 account.duplicate, 503 when IDAM is unreachable (fails closed). BRD: US-1.1.1, US-1.1.2, US-2.1.1, US-3.1.1. Roles (active role): any user with a valid IDAM token.'
      security:
      - IdamBearer: []
      x-dahc-roles:
      - VALID_TOKEN
      responses:
        '200':
          description: Signed-in session.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/me:
    get:
      tags:
      - Identity
      operationId: getCurrentSession
      summary: Get the current user, roles and active role
      description: 'Same as sign-in without provisioning or profile refresh. Success: 200 with the session. Empty: not applicable. Error: 401 invalid token, 403 account.not_registered for an identity that never signed in, 403 account.deactivated, otherwise standard Problem response. BRD: US-1.1.2, US-2.1.1 AC5. Roles (active role): any user with a valid IDAM token.'
      security:
      - IdamBearer: []
      x-dahc-roles:
      - VALID_TOKEN
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/active-role:
    put:
      tags:
      - Identity
      operationId: switchActiveRole
      summary: Switch the staff user's active role
      description: 'Sets the active role used for all authorization, on every tab and device (BRD role switcher). The role must be one the user holds; the switch is audited. Candidates hold one role and cannot switch. Success: 200 with the updated session. Empty: not applicable. Error: 403 when the role is not held, otherwise standard Problem response. BRD: US-2.1.1 AC5, US-3.1.1 AC5. Roles (active role): ADMISSION_OFFICER, ADMISSION_SUPERVISOR, CENTRAL_MONITOR, FINANCE_OFFICER, REFEREE, THIRD_REFEREE, SECOND_EVALUATION_REFEREE, SENIOR_REFEREE, ADMINISTRATOR.'
      security:
      - IdamBearer: []
      x-dahc-roles:
      - ADMISSION_OFFICER
      - ADMISSION_SUPERVISOR
      - CENTRAL_MONITOR
      - FINANCE_OFFICER
      - REFEREE
      - THIRD_REFEREE
      - SECOND_EVALUATION_REFEREE
      - SENIOR_REFEREE
      - ADMINISTRATOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - roleCode
              properties:
                roleCode:
                  $ref: '#/components/schemas/StaffRoleCode'
      responses:
        '200':
          description: Active role switched.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/admin/staff-users:
    get:
      tags:
      - Administration
      operationId: listStaffUsers
      summary: List staff users
      description: 'Administrator-only list of pre-registered and active staff users with their roles. Success: 200 with a page of staff users. Empty: 200 with an empty data list and a messageCode. Error: standard Problem response. Roles (active role): ADMINISTRATOR.'
      security:
      - IdamBearer: []
      x-dahc-roles:
      - ADMINISTRATOR
      parameters:
      - name: roleCode
        in: query
        schema:
          $ref: '#/components/schemas/StaffRoleCode'
      - name: isActive
        in: query
        schema:
          type: boolean
      - name: q
        in: query
        description: Search over name and email.
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Staff users.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiListResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Administration
      operationId: preRegisterStaffUser
      summary: Pre-register a staff user
      description: 'Administrator-only. Creates a staff user with their IDAM user identifier and staff roles before their first sign-in; at that sign-in the identity is matched to this record and no Candidate is created. A person who is also a candidate is linked by linkedCandidateId so they can never act on their own applications. Audited. Success: 201 with the staff user. Empty: not applicable. Error: 409 staff.already_registered for a known IDAM identifier, 422 invalid roles or scopes, otherwise standard Problem response. Roles (active role): ADMINISTRATOR.'
      security:
      - IdamBearer: []
      x-dahc-roles:
      - ADMINISTRATOR
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserInput'
      responses:
        '201':
          description: Staff user pre-registered.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/admin/staff-users/{staffUserId}:
    get:
      tags:
      - Administration
      operationId: getStaffUser
      summary: Read a staff user
      description: 'Administrator-only. Success: 200 with the staff user. Empty: 404 when missing. Error: standard Problem response. Roles (active role): ADMINISTRATOR.'
      security:
      - IdamBearer: []
      x-dahc-roles:
      - ADMINISTRATOR
      parameters:
      - name: staffUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Staff user.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/admin/staff-users/{staffUserId}/roles:
    put:
      tags:
      - Administration
      operationId: setStaffUserRoles
      summary: Grant or revoke a staff user's roles and pool scopes
      description: 'Administrator-only. Replaces the user''s staff roles and their program/specialty pool scopes. Refuses self-elevation. Removing the active role makes the next request fall back to the user''s default role. Removing every role is refused: deactivate the user instead. Every change is audited (who, whom, which role, when). Success: 200 with the staff user. Empty: not applicable. Error: 403 self-elevation, 409 a concurrent change (If-Match), 422 no roles or an invalid scope, otherwise standard Problem response. Roles (active role): ADMINISTRATOR.'
      security:
      - IdamBearer: []
      x-dahc-roles:
      - ADMINISTRATOR
      parameters:
      - name: staffUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - roles
              properties:
                roles:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/StaffRoleAssignment'
      responses:
        '200':
          description: Roles updated.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/admin/staff-users/{staffUserId}/deactivation:
    post:
      tags:
      - Administration
      operationId: deactivateStaffUser
      summary: Deactivate a staff user
      description: 'Administrator-only. A deactivated user is refused on the next request and is never reactivated by signing in. Open work assigned to the user stays assigned until a supervisor reassigns it. Audited. Success: 200 with the staff user. Empty: not applicable. Error: 409 already inactive or the caller''s own account, otherwise standard Problem response. Roles (active role): ADMINISTRATOR.'
      security:
      - IdamBearer: []
      x-dahc-roles:
      - ADMINISTRATOR
      parameters:
      - name: staffUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: Staff user deactivated.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/admin/staff-users/{staffUserId}/reactivation:
    post:
      tags:
      - Administration
      operationId: reactivateStaffUser
      summary: Reactivate a staff user
      description: 'Administrator-only, audited. Success: 200 with the staff user. Empty: not applicable. Error: 409 already active, otherwise standard Problem response. Roles (active role): ADMINISTRATOR.'
      security:
      - IdamBearer: []
      x-dahc-roles:
      - ADMINISTRATOR
      parameters:
      - name: staffUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Staff user reactivated.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/admin/integration-clients:
    get:
      tags:
      - Administration
      operationId: listIntegrationClients
      summary: List integration clients
      description: 'Administrator-only list of third-party middleware registered as IDAM confidential clients, with their internal permissions. Success: 200 with a page. Empty: 200 with an empty data list and a messageCode. Error: standard Problem response. Roles (active role): ADMINISTRATOR.'
      security:
      - IdamBearer: []
      x-dahc-roles:
      - ADMINISTRATOR
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Integration clients.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiListResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/IntegrationClient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Administration
      operationId: registerIntegrationClient
      summary: Register an integration client
      description: 'Administrator-only. Records a middleware''s IDAM client id and internal permissions. Records are never created automatically and IDAM scopes or claims never grant a permission. Audited. Success: 201 with the client. Empty: not applicable. Error: 409 integration.already_registered, 422 unknown permission, otherwise standard Problem response. Roles (active role): ADMINISTRATOR.'
      security:
      - IdamBearer: []
      x-dahc-roles:
      - ADMINISTRATOR
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationClientInput'
      responses:
        '201':
          description: Integration client registered.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/IntegrationClient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/admin/integration-clients/{integrationClientId}:
    put:
      tags:
      - Administration
      operationId: updateIntegrationClient
      summary: Change an integration client's name, permissions or active flag
      description: 'Administrator-only, audited. A deactivated client gets 403 on its next request. Success: 200 with the client. Empty: not applicable. Error: 409 concurrent change (If-Match), 422 unknown permission, otherwise standard Problem response. Roles (active role): ADMINISTRATOR.'
      security:
      - IdamBearer: []
      x-dahc-roles:
      - ADMINISTRATOR
      parameters:
      - name: integrationClientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationClientInput'
      responses:
        '200':
          description: Integration client updated.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/IntegrationClient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/programs:
    get:
      tags:
      - Catalog
      operationId: listPrograms
      summary: List programs open or configured for a cycle
      description: 'Returns only programs visible to the caller and eligible for application according to current configuration. Success: 200 with a paginated ProgramList. Empty: 200 with an empty data list and a messageCode and page.nextCursor=null. Error: standard Problem response. GME BRD traceability: US-1.3.1. Roles (active role): any active signed-in user.'
      security:
      - IdamBearer: []
      parameters:
      - $ref: '#/components/parameters/CycleId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/ProgramSort'
      responses:
        '200':
          description: Paginated program catalog; an empty catalog is a successful empty list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiListResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-dahc-roles:
      - ANY_ACTIVE_USER
  /api/v1/programs/{programId}/specialties:
    get:
      tags:
      - Catalog
      operationId: listProgramSpecialties
      summary: List active specialties for a program
      description: 'Success: 200 with paginated active specialties. Empty: 200 with an empty data list and a messageCode when the program has no active specialties. Error: 404 when the program is unknown or not visible, otherwise a standard Problem response. GME BRD traceability: US-1.3.1. Roles (active role): any active signed-in user.'
      security:
      - IdamBearer: []
      parameters:
      - name: programId
        in: path
        required: true
        description: Opaque program identifier.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/SpecialtySort'
      responses:
        '200':
          description: Paginated specialty list; no active specialties is an empty success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiListResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Specialty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-dahc-roles:
      - ANY_ACTIVE_USER
  /api/v1/specialties/{specialtyId}/sites:
    get:
      tags:
      - Catalog
      operationId: listSpecialtyTrainingSites
      summary: List active training sites for a specialty
      description: 'Success: 200 with paginated active training sites. Empty: 200 with an empty data list and a messageCode when no active sites are configured. Error: 404 when the specialty is unknown or not visible, otherwise a standard Problem response. GME BRD traceability: US-1.3.1. Roles (active role): any active signed-in user.'
      security:
      - IdamBearer: []
      parameters:
      - name: specialtyId
        in: path
        required: true
        description: Opaque specialty identifier.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/TrainingSiteSort'
      responses:
        '200':
          description: Paginated training site list; no active sites is an empty success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiListResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/TrainingSite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-dahc-roles:
      - ANY_ACTIVE_USER
  /api/v1/lookups/{lookupType}:
    get:
      tags:
      - Catalog
      operationId: listLookupValues
      summary: List configured values for a workflow drop-down
      description: 'Returns the configured codes and labels behind workflow drop-downs, so clients never hard-code business lists. Candidate tokens may read WITHDRAWAL_REASON only; the other types are for staff and referee roles and return 403 to candidates. PORTFOLIO_REJECTION_REASON and PORTFOLIO_CLASSIFICATION are scoped by programId and, optionally, questionId (parentCode). Inactive values are excluded unless includeInactive=true. Success: 200 with LookupList. Empty: 200 with an empty data list and a messageCode when nothing is configured. Error: 400 for an unknown type or filter, otherwise standard Problem response. BRD: US-1.2.4, US-2.3.2, US-2.4.1, US-2.4.3, US-2.5.2, US-3.3.3, US-4.4.1, Appendix (Screen Out Reasons, Portfolio Rejection Reasons). Roles (active role): any active signed-in user.'
      security:
      - IdamBearer: []
      parameters:
      - name: lookupType
        in: path
        required: true
        schema:
          type: string
          enum:
          - WITHDRAWAL_REASON
          - CORRECTION_NOTE_TEMPLATE
          - SCREEN_OUT_REASON
          - REINSTATEMENT_REJECTION_REASON
          - PORTFOLIO_REJECTION_REASON
          - PORTFOLIO_CLASSIFICATION
      - name: programId
        in: query
        description: Required for the PORTFOLIO_* types.
        schema:
          type: string
          format: uuid
      - name: questionId
        in: query
        description: Limits PORTFOLIO_* values to one question.
        schema:
          type: string
          format: uuid
      - name: includeInactive
        in: query
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Configured lookup values.
          content:
            application/json:
              schema:
