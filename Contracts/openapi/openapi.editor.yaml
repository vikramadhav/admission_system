            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/BulkWorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-dahc-roles:
      - ADMISSION_SUPERVISOR
components:
  securitySchemes:
    IdamBearer:
      type: http
      scheme: bearer
      description: Opaque IDAM access token in the Authorization header, validated by IDAM introspection (RFC 7662). Only tokens issued to registered DAHC clients are accepted; ID tokens never are. Identity comes from introspection and UserInfo only. Authorization uses internal roles (x-dahc-roles) and, for middleware, internal integration permissions (x-dahc-integration-permission). 401 for a missing, inactive or rejected token; 503 when IDAM is unreachable (fails closed).
  headers:
    RequestId:
      description: Server-generated request correlation identifier.
      schema:
        type: string
  schemas:
    Program:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - name
      - category
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        category:
          type: string
          enum:
          - CERTIFICATE
          - INTERNSHIP
          - RESIDENCY
          - FELLOWSHIP
        cycleId:
          type: string
          format: uuid
        applicationOpensAt:
          type:
          - string
          - 'null'
          format: date-time
        applicationClosesAt:
          type:
          - string
          - 'null'
          format: date-time
        timeZoneId:
          type: string
          example: Asia/Dubai
          description: IANA time zone in which the opening and deadline dates are defined.
    Specialty:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    TrainingSite:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    ApplicationStatus:
      type: string
      description: Candidate-visible application lifecycle status. Internal workflow statuses are not exposed by this schema.
      enum:
      - DRAFT
      - SUBMITTED
      - UNDER_REVIEW
      - CORRECTION_REQUIRED
      - CORRECTION_SUBMITTED
      - SCREENED_OUT
      - REVIEW_COMPLETED
      - APPEAL_UNDER_REVIEW
      - WITHDRAWN
      - ARCHIVED
    VerificationStatus:
      type: string
      enum:
      - PENDING
      - IN_PROGRESS
      - CORRECTION_REQUIRED
      - CORRECTION_SUBMITTED
      - PENDING_CLARIFICATION
      - CLARIFICATION_SUBMITTED
      - SCREEN_OUT_PENDING_APPROVAL
      - RE_EVALUATING
      - COMPLETE
      - SCREENED_OUT
      - ON_HOLD
    PortfolioStatus:
      type: string
      description: Overall portfolio-scoring status (BRD Portfolio Status profile). It is separate from each round's PortfolioRoundStatus and must not be combined with it.
      enum:
      - PENDING
      - IN_PROGRESS
      - THIRD_REFEREE_REQUIRED
      - THIRD_ROUND_IN_PROGRESS
      - COMPLETE
      - SECOND_EVALUATION_REQUIRED
      - SECOND_EVALUATION_IN_PROGRESS
      - ON_HOLD
    PortfolioRoundStatus:
      type: string
      description: Status of one scoring round (BRD Portfolio Round Status profile). ON_HOLD reverts to the previous status when a withdrawn or screened-out application is reinstated.
      enum:
      - PENDING
      - IN_PROGRESS
      - COMPLETE
      - ON_HOLD
    AnnouncementStatus:
      type: string
      enum:
      - PENDING
      - READY_FOR_INITIAL_ANNOUNCEMENT
      - ANNOUNCED
      - APPEAL_UNDER_REVIEW
      - READY_FOR_REANNOUNCEMENT
      - REANNOUNCED
    PaymentStatus:
      type: string
      enum:
      - PENDING
      - PAID
      - FAILED
      - CANCELLED
      - UNKNOWN
    PaymentGatewayProvider:
      type: string
      description: Internal adapter identifier. Never expose this value to candidate clients.
      enum:
      - E_PAY
      - NETWORK_INTERNATIONAL
    PaymentRoutingConfiguration:
      type: object
      description: Internal deployment configuration; never expose secrets or this object to candidate clients.
      additionalProperties: false
      required:
      - activeProvider
      - version
      - effectiveAt
      properties:
        activeProvider:
          $ref: '#/components/schemas/PaymentGatewayProvider'
        version:
          type: string
          description: Immutable configuration version captured by newly created payment sessions.
        effectiveAt:
          type: string
          format: date-time
    PaymentGatewayCreateRequest:
      type: object
      description: Provider-neutral payment service to adapter request.
      additionalProperties: false
      required:
      - paymentSessionId
      - amount
      - currency
      - returnUrl
      - idempotencyKey
      properties:
        paymentSessionId:
          type: string
          format: uuid
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          const: AED
        returnUrl:
          type: string
          format: uri
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 128
    PaymentGatewayCheckoutResult:
      type: object
      description: Provider-neutral adapter result; provider payloads remain inside the adapter.
      additionalProperties: false
      required:
      - providerSessionReference
      - checkoutUrl
      properties:
        providerSessionReference:
          type: string
        checkoutUrl:
          type: string
          format: uri
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
    PaymentProviderBinding:
      type: object
      description: Internal immutable binding for reconciliation; never return to candidate clients.
      additionalProperties: false
      required:
      - paymentSessionId
      - provider
      - configurationVersion
      - providerSessionReference
      properties:
        paymentSessionId:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/PaymentGatewayProvider'
        configurationVersion:
          type: string
        providerSessionReference:
          type: string
    PaymentGatewayEvent:
      type: object
      additionalProperties: false
      required:
      - provider
      - providerEventId
      - paymentSessionId
      - status
      - amount
      - currency
      - occurredAt
      properties:
        provider:
          $ref: '#/components/schemas/PaymentGatewayProvider'
        providerEventId:
          type: string
          description: Stable provider event identifier, scoped to the provider.
        providerTransactionId:
          type: string
          description: Provider transaction reference for reconciliation; never a payment credential.
        paymentSessionId:
          type: string
          description: Platform payment-session ID resolved by the adapter.
          format: uuid
        status:
          type: string
          enum:
          - PAID
          - FAILED
          - CANCELLED
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          const: AED
        occurredAt:
          type: string
          format: date-time
        receiptId:
          type: string
    WorkflowStatus:
      type: string
      description: Status vocabulary returned by generic workflow actions and work queues. Resource-specific endpoints remain authoritative for valid transitions.
      enum:
      - DRAFT
      - SUBMITTED
      - UNDER_REVIEW
      - PENDING
      - IN_PROGRESS
      - CORRECTION_REQUIRED
      - CORRECTION_SUBMITTED
      - PENDING_CLARIFICATION
      - CLARIFICATION_SUBMITTED
      - SCREEN_OUT_PENDING_APPROVAL
      - RE_EVALUATING
      - COMPLETE
      - SCREENED_OUT
      - REVIEW_COMPLETED
      - THIRD_REFEREE_REQUIRED
      - THIRD_ROUND_IN_PROGRESS
      - SECOND_EVALUATION_REQUIRED
      - SECOND_EVALUATION_IN_PROGRESS
      - ON_HOLD
      - READY_FOR_INITIAL_ANNOUNCEMENT
      - ANNOUNCED
      - APPEAL_UNDER_REVIEW
      - READY_FOR_REANNOUNCEMENT
      - REANNOUNCED
      - WITHDRAWN
      - ARCHIVED
      - PAID
      - FAILED
      - CANCELLED
      - UNKNOWN
    PreferenceInput:
      type: object
      additionalProperties: false
      required:
      - specialtyId
      - preferenceOrder
      - trainingSites
      properties:
        specialtyId:
          type: string
          format: uuid
        preferenceOrder:
          type: integer
          minimum: 1
          maximum: 2
        trainingSites:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TrainingSitePreferenceInput'
    TrainingSitePreferenceInput:
      type: object
      additionalProperties: false
      required:
      - siteId
      - siteOrder
      properties:
        siteId:
          type: string
          format: uuid
        siteOrder:
          type: integer
          minimum: 1
    ApplicationSummary:
      type: object
      required:
      - id
      - applicationNumber
      - program
      - status
      - createdAt
      - version
      properties:
        id:
          type: string
          format: uuid
          description: Application UUID used in URLs.
        applicationNumber:
          $ref: '#/components/schemas/ApplicationNumber'
        program:
          $ref: '#/components/schemas/Program'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
          minimum: 1
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/PreferenceInput'
        announcedScores:
          oneOf:
          - $ref: '#/components/schemas/AnnouncedScores'
          - type: 'null'
          description: Present only after the applicable official announcement.
    Application:
      allOf:
      - $ref: '#/components/schemas/ApplicationSummary'
      - type: object
        properties:
          sections:
            type: object
            description: Extensible, program-configured draft sections. Only approved schema fields are accepted.
            additionalProperties: true
    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required:
      - programId
      - preferences
      properties:
        programId:
          type: string
          format: uuid
        preferences:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/PreferenceInput'
    UpdateDraftRequest:
      type: object
      description: JSON Merge Patch document. Only fields permitted by the current draft schema may be changed.
      minProperties: 1
      properties:
        preferences:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/PreferenceInput'
        sections:
          type: object
          additionalProperties: true
    Page:
      type: object
      additionalProperties: false
      required:
      - limit
      - nextCursor
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; null means there is no next page.
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
      - code
      - detail
      properties:
        code:
          type: string
          example: field.required
        detail:
          type: string
          description: Safe, user-actionable message; must not contain confidential values.
        pointer:
          type: string
          description: JSON Pointer to the invalid request field where applicable.
    Problem:
      type: object
      description: RFC 7807 Problem Details, returned at the top level with application/problem+json, never inside the success envelope (D-02). detail is localized and safe to show.
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe summary of the failure; never expose stack traces or sensitive data.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: ^[a-z]+(\.[a-z_]+)+$
          description: Stable, dotted business error code, e.g. account.not_registered, request.validation_failed, icp.preview_invalid. Clients branch on this, never on detail.
          example: account.not_registered
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        traceId:
          type: string
          description: W3C trace id shown to the user for support.
    WorkflowActionRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        note:
          type:
          - string
          - 'null'
          maxLength: 500
        justification:
          type:
          - string
          - 'null'
          maxLength: 500
    WorkflowActionResult:
      type: object
      additionalProperties: false
      required:
      - resourceId
      - status
      - effectiveAt
      - auditEventId
      properties:
        resourceId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/WorkflowStatus'
          description: Current authoritative workflow status after the action.
        effectiveAt:
          type: string
          format: date-time
        auditEventId:
          type: string
          format: uuid
        messageCode:
          type: string
    ApplicationSection:
      type: object
      additionalProperties: false
      required:
      - applicationId
      - sectionKey
      - schemaVersion
      - values
      - fields
      - editable
      - version
      properties:
        applicationId:
          type: string
          format: uuid
        sectionKey:
          type: string
          enum:
          - application-information
          - personal-information
          - academic-information
          - english-proficiency
          - internship-information
          - residency-information
          - board-license-information
          - residency-entrance-exam
        values:
          type: object
          description: Candidate values keyed by the field code in the accompanying field definitions.
          additionalProperties: {}
        schemaVersion:
          type: string
          description: Immutable form schema version used to render and validate this section.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormFieldDefinition'
        editable:
          type: boolean
        version:
          type: integer
          minimum: 1
    ApplicationFormSchema:
      type: object
      additionalProperties: false
      required:
      - applicationId
      - schemaVersion
      - sections
      properties:
        applicationId:
          type: string
          format: uuid
        schemaVersion:
          type: string
        sections:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - sectionKey
            - fields
            properties:
              sectionKey:
                type: string
              fields:
                type: array
                items:
                  $ref: '#/components/schemas/FormFieldDefinition'
    FormFieldDefinition:
      type: object
      additionalProperties: false
      required:
      - fieldCode
      - label
      - dataType
      - visible
      - required
      - readOnly
      properties:
        fieldCode:
          type: string
        label:
          type: string
        dataType:
          type: string
          enum:
          - STRING
          - TEXT
          - INTEGER
          - DECIMAL
          - BOOLEAN
          - DATE
          - DATE_TIME
          - SINGLE_SELECT
          - MULTI_SELECT
          - FILE_REFERENCE
          - URL
        visible:
          type: boolean
        required:
          type: boolean
        readOnly:
          type: boolean
        constraints:
          $ref: '#/components/schemas/FieldConstraints'
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - label
            properties:
              code:
                type: string
              label:
                type: string
        dependsOn:
          type: array
          items:
            type: string
        visibleWhen:
          description: When present, all conditions must match for this field to be shown.
          type: array
          items:
            $ref: '#/components/schemas/FormCondition'
        requiredWhen:
          description: When present, all conditions must match for this field to be required.
          type: array
          items:
            $ref: '#/components/schemas/FormCondition'
    FieldConstraints:
      type: object
      additionalProperties: false
      properties:
        minLength:
          type: integer
          minimum: 0
        maxLength:
          type: integer
          minimum: 0
        minimum:
          type: number
        maximum:
          type: number
        multipleOf:
          type: number
          exclusiveMinimum: 0
        pattern:
          type: string
        format:
          type: string
        allowedFileTypes:
          type: array
          items:
            type: string
        maxFileSizeBytes:
          type: integer
          minimum: 1
    FormCondition:
      type: object
      additionalProperties: false
      required:
      - fieldCode
      - operator
      properties:
        fieldCode:
          type: string
        operator:
          type: string
          enum:
          - EQ
          - NE
          - IN
          - NOT_IN
          - GT
          - GTE
          - LT
          - LTE
          - NOT_EMPTY
          - EMPTY
        value: {}
    ApplicationSectionInput:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - values
      properties:
        schemaVersion:
          type: string
          description: Must match the currently applicable form schema version.
        values:
          type: object
          description: Only field codes defined in the schema version are accepted.
          additionalProperties: {}
    PortfolioSubmission:
      type: object
      additionalProperties: false
      required:
      - submittedAt
      - immutable
      - answers
      properties:
        submittedAt:
          type: string
          format: date-time
        immutable:
          const: true
        answers:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - questionId
            - answer
            properties:
              questionId:
                type: string
                format: uuid
              answer:
                type: string
                enum:
                - 'YES'
                - 'NO'
              details:
                type: object
                additionalProperties: true
              evidenceIds:
                type: array
                items:
                  type: string
    PortfolioSubmissionInput:
      type: object
      additionalProperties: false
      required:
      - answers
      - confirmed
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - questionId
            - answer
            properties:
              questionId:
                type: string
                format: uuid
              answer:
                type: string
                enum:
                - 'YES'
                - 'NO'
              details:
                type: object
                additionalProperties: true
              evidenceIds:
                type: array
                items:
                  type: string
        confirmed:
          const: true
    PaymentSession:
      type: object
      additionalProperties: false
      required:
      - id
      - applicationId
      - amount
      - currency
      - status
      properties:
        id:
          type: string
        applicationId:
          type: string
          format: uuid
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          const: AED
        status:
          $ref: '#/components/schemas/PaymentStatus'
        checkoutUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Provider-hosted checkout URL returned through the normalized adapter. The client must treat it as opaque and must not infer the gateway.
        checkoutExpiresAt:
          type:
          - string
          - 'null'
          format: date-time
        receiptId:
          type:
          - string
          - 'null'
        paymentDate:
          type:
          - string
          - 'null'
          format: date-time
    PaymentRecord:
      type: object
      additionalProperties: false
      required:
      - applicationId
      - applicationNumber
      - program
      - feeType
      - billStatus
      - billAmount
      properties:
        applicationId:
          type: string
          format: uuid
        applicationNumber:
          $ref: '#/components/schemas/ApplicationNumber'
        candidateDisplayName:
          type: string
        email:
          type: string
          format: email
        program:
          type: string
        feeType:
          type: string
        billStatus:
          type: string
          enum:
          - NA
          - PENDING
          - PAID
          - FAILED
        billAmount:
          type: number
          minimum: 0
        paymentDate:
          type:
          - string
          - 'null'
          format: date-time
    WorkItem:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - createdAt
      properties:
        id:
          type: string
        applicationId:
          type: string
          format: uuid
        applicationNumber:
          $ref: '#/components/schemas/ApplicationNumber'
        portfolioId:
          type: string
          format: uuid
        program:
          type: string
        specialty:
          type: string
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        submittedAt:
          type:
          - string
          - 'null'
          format: date-time
        retrievedAt:
          type:
          - string
          - 'null'
          format: date-time
        dueAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    CorrectionFlag:
      type: object
      additionalProperties: false
      required:
      - fieldPointer
      - candidateNoteCode
      properties:
        fieldPointer:
          type: string
          description: JSON Pointer to the field, attachment, section, or subsection flagged.
        candidateNoteCode:
          type: string
        candidateNote:
          type: string
          maxLength: 500
    CorrectionFlagSet:
      type: object
      additionalProperties: false
      required:
      - flags
      properties:
        flags:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CorrectionFlag'
    OfficerDecision:
      type: object
      additionalProperties: false
      description: 'Supervisor decision on a recommended screen-out. A note is mandatory only for rejection; endorsement may change the screen-out reason. BRD: US-2.4.3, STP-2.4 rule 3.'
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - ENDORSE_SCREEN_OUT
          - REJECT_SCREEN_OUT
        reasonCode:
          type:
          - string
          - 'null'
          description: Screen-out reason from lookup SCREEN_OUT_REASON. On endorsement it replaces the officer's reason (US-2.4.3 AC2); when null the officer's reason is kept. Ignored on rejection.
        note:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Mandatory when decision is REJECT_SCREEN_OUT.
      allOf:
      - if:
          required:
          - decision
          properties:
            decision:
              const: REJECT_SCREEN_OUT
        then:
          required:
          - note
          properties:
            note:
              type: string
              minLength: 1
    AssignmentRequest:
      type: object
      additionalProperties: false
      required:
      - targetUserId
      - justification
      properties:
        targetUserId:
          type: string
          format: uuid
        justification:
          type: string
          minLength: 1
          maxLength: 200
    ScoreInput:
      type: object
      additionalProperties: false
      description: 'The referee''s decision on one question for the active round. The service computes the question score: all-or-nothing questions award full points on ACCEPT; points-system questions award the points mapped to the classification; REJECT always awards zero. BRD: US-3.3.3.'
      required:
      - questionId
      - decision
      properties:
        questionId:
          type: string
          format: uuid
        decision:
          type: string
          enum:
          - ACCEPT
          - REJECT
        classificationCode:
          type:
          - string
          - 'null'
          description: Required when decision is ACCEPT and the question uses the points system; otherwise null. Codes come from lookup PORTFOLIO_CLASSIFICATION for the question. A missing or unexpected classification returns 422.
        rejectionReasonCodes:
          type: array
          uniqueItems: true
          items:
            type: string
          description: One or more reasons, required when decision is REJECT and empty otherwise. Codes come from lookup PORTFOLIO_REJECTION_REASON for the question. The candidate-facing comment is the predefined comment mapped to each reason.
        questionScore:
          type:
          - number
          - 'null'
          readOnly: true
          description: Points awarded for this question, computed by the service.
      allOf:
      - if:
          required:
          - decision
          properties:
            decision:
              const: REJECT
        then:
          required:
          - rejectionReasonCodes
          properties:
            rejectionReasonCodes:
              minItems: 1
    ScoreSet:
      type: object
      additionalProperties: false
      required:
      - rubricVersion
      - scores
      properties:
        rubricVersion:
          type: string
        scores:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ScoreInput'
        totalPoints:
          type:
          - number
          - 'null'
          readOnly: true
          description: Total Portfolio Points for this referee's round, computed by the service.
    ScoreSubmission:
      type: object
      additionalProperties: false
      required:
