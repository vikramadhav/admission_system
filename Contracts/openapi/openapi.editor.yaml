      description: 'Finalizes submission only after confirmed payment, complete validation, and required attachment persistence. Success: 200 with submitted Application. Empty: not applicable. Error: 409 if payment is not confirmed or already submitted; 422 for incomplete application; 503 for required dependency failure. Operation is idempotent. BRD: US-1.3.12. Roles (active role): CANDIDATE.'
