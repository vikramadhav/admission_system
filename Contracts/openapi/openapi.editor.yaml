                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - requestId
                      - expiresAt
                      - resendAvailableAt
                      - destinations
                      properties:
                        requestId:
                          type: string
                          format: uuid
                        expiresAt:
                          type: string
                          format: date-time
                        resendAvailableAt:
                          type: string
                          format: date-time
                        destinations:
                          type: array
                          items:
