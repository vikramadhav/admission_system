  /api/v1/staff/candidates/{candidateId}/icp-refresh:
    post:
      tags:
      - Admission Operations
      operationId: refreshCandidateInformationFromIcp
      summary: Apply selected ICP values to the candidate
      description: 'Applies the ICP values captured by previewCandidateIcpRefresh for the selected fields only (Update All sends every differing field). ICP is not called again, so the stored data matches what the supervisor reviewed. Each change is recorded in the candidate change history with field, original value, new value, user and time (D-06); the audit log records the action only, never values. The token is single-use and bound to the candidate, the reason and the supervisor. Success: 200 with the applied field names. Empty: not applicable. Error: 409 icp.preview_invalid when the token is expired, used or issued for another candidate, reason or user; 409 icp.preview_stale when stored data changed after the preview; 422 when a field was not in the preview or did not differ; otherwise standard Problem response. BRD: US-2.5.3 AC8-AC13. Roles (active role): ADMISSION_SUPERVISOR.'
      security:
      - IdamBearer: []
      parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requestReason
              - previewToken
              - fieldCodes
              - confirmed
              properties:
                requestReason:
                  type: string
                  enum:
                  - IDENTITY_EXPIRY
                  - DETAILS_CHANGE
                  description: Must match the reason used for the preview.
                previewToken:
                  type: string
                  minLength: 1
                  maxLength: 512
                fieldCodes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                confirmed:
                  const: true
      responses:
        '200':
          description: Selected fields updated.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - refreshedAt
                      - changedFields
                      - auditEventId
                      properties:
                        refreshedAt:
                          type: string
                          format: date-time
                        changedFields:
                          type: array
                          items:
                            type: string
                        auditEventId:
                          type: string
                          format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/ServerError'
      x-dahc-roles:
      - ADMISSION_SUPERVISOR
  /api/v1/staff/candidates/{candidateId}/icp-refresh-preview:
    post:
      tags:
      - Admission Operations
      operationId: previewCandidateIcpRefresh
      summary: Compare stored candidate data with the latest ICP data
      description: 'Supervisor-only. Calls ICP through the integration middleware and returns only the ICP-sourced fields, each with the current value, the latest ICP value and whether they differ. Nothing is changed. The ICP values are held server-side with a short-lived, single-use preview token used to apply them. Success: 200 with the comparison. Empty: 200 with differencesFound=false and null previewToken when nothing differs ("no updates are required"). Error: 503 when ICP or the middleware is unavailable (no data changed), otherwise standard Problem response. BRD: US-2.5.3 AC3-AC7, AC14-AC16. Roles (active role): ADMISSION_SUPERVISOR.'
      security:
      - IdamBearer: []
      parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requestReason
              properties:
                requestReason:
                  type: string
                  enum:
                  - IDENTITY_EXPIRY
                  - DETAILS_CHANGE
      responses:
        '200':
          description: Field-by-field comparison; no candidate data is changed.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - differencesFound
                      - previewToken
                      - expiresAt
                      - fields
                      properties:
                        differencesFound:
                          type: boolean
                        previewToken:
                          type:
                          - string
                          - 'null'
                          description: Single-use token for refreshCandidateInformationFromIcp. Null when nothing differs.
                        expiresAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: When the preview token expires. Null when nothing differs.
                        fields:
                          type: array
                          items:
                            $ref: '#/components/schemas/IcpFieldComparison'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-dahc-roles:
      - ADMISSION_SUPERVISOR
