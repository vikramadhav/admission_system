        schema:
          type: string
          minLength: 16
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - paymentSessionId
              - confirmed
              properties:
                paymentSessionId:
                  type: string
                  format: uuid
                confirmed:
                  const: true
      responses:
        '200':
          description: Application submitted; subsequent candidate form reads are read-only.
