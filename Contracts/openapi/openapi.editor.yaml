  /api/v1/staff/reinstatement-requests/{requestId}/decision:
    post:
      tags:
      - Admission Operations
      operationId: decideReinstatementRequest
      summary: Approve or reject a candidate reinstatement request
      description: 'Supervisor decision with a mandatory note; rejection also needs a reason from lookup REINSTATEMENT_REJECTION_REASON. Approval restores the application, verification and portfolio statuses from before the withdrawal and returns it to the same pool. Rejection keeps it Withdrawn. The candidate is emailed either way. Success: 200 with workflow result. Empty: not applicable. Error: 409 reinstatement.already_decided or application.active_exists, 422 missing reason, otherwise standard Problem response. BRD: US-2.5.2, STP-2.5 rule 4. Roles (active role): ADMISSION_SUPERVISOR.'
      security:
      - IdamBearer: []
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - decision
              - note
              properties:
                decision:
                  type: string
                  enum:
                  - APPROVE
                  - REJECT
                reasonCode:
                  type:
                  - string
                  - 'null'
                  description: Required for REJECT.
                note:
                  type: string
                  minLength: 1
                  maxLength: 500
              allOf:
              - if:
                  required:
                  - decision
                  properties:
                    decision:
                      const: REJECT
                then:
                  required:
                  - reasonCode
                  properties:
                    reasonCode:
                      type: string
                      minLength: 1
      responses:
        '200':
          description: Decision recorded and candidate notified.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/WorkflowActionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/ServerError'
      x-dahc-roles:
      - ADMISSION_SUPERVISOR
