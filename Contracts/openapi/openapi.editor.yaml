          type: string
          example: Asia/Dubai
          description: IANA time zone id.
        culture:
          type: string
          enum:
          - en-AE
          - ar-AE
    AuthSession:
      type: object
      additionalProperties: false
      description: The signed-in user as known to DAHC. Candidates and staff are separate records (D-04).
      required:
      - userType
      - userId
      - displayName
      - roles
      - activeRole
      - preferences
      properties:
        userType:
          type: string
          enum:
          - CANDIDATE
          - STAFF
        userId:
          type: string
          format: uuid
        candidateNumber:
          oneOf:
          - $ref: '#/components/schemas/CandidateNumber'
          - type: 'null'
          description: Candidates only.
        displayName:
          type: string
        email:
          type:
          - string
          - 'null'
          format: email
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: CANDIDATE alone, or one or more StaffRoleCode values.
        activeRole:
          type: string
          description: Role used for authorization on every request.
        preferences:
          $ref: '#/components/schemas/UserPreferences'
    StaffRoleAssignment:
      type: object
      additionalProperties: false
      required:
      - roleCode
      properties:
        roleCode:
          $ref: '#/components/schemas/StaffRoleCode'
        programId:
          type:
          - string
          - 'null'
          format: uuid
          description: Null means all programs.
        specialtyId:
          type:
          - string
          - 'null'
          format: uuid
          description: Null means all specialties of the program.
        poolIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Work pools the user retrieves from (officers and referees).
        validFrom:
          type:
          - string
          - 'null'
          format: date
        validTo:
          type:
          - string
          - 'null'
          format: date
    StaffUserInput:
      type: object
      additionalProperties: false
      required:
      - idamUserId
      - displayName
      - email
      - roles
      properties:
        idamUserId:
          type: string
          minLength: 1
          maxLength: 200
          description: IDAM immutable user identifier; the only match key at sign-in.
        displayName:
          type: string
          minLength: 1
          maxLength: 200
