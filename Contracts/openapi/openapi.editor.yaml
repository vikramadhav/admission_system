        name:
          type: string
        isActive:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        version:
          type: string
  responses:
    BadRequest:
      description: Request or query parameter is malformed or unsupported.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired, malformed, or invalid access token.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated caller lacks the required scope, role, or resource ownership.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Current resource state or idempotency key conflicts with the request.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Validation:
      description: Request is syntactically valid but violates a business or field validation rule.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not match the current resource version.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Required If-Match precondition was not supplied.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Caller exceeded the configured request rate.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds to wait before retrying, when known.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServerError:
      description: Unexpected server failure. A requestId is returned for support correlation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A required dependency is unavailable; retry behavior depends on operation idempotency.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds to wait before retrying, when known.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    CycleId:
      name: cycleId
      in: query
      required: true
      description: Opaque admission-cycle identifier.
      schema:
        type: string
        format: uuid
    CycleIdOptional:
      name: cycleId
      in: query
      required: false
      description: Optional opaque admission-cycle filter. When omitted, return the candidate's applications across cycles.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum records per page; default 25 and maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page. Do not construct or modify it.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    ProgramSort:
      name: sort
      in: query
      required: false
      description: Allow-listed comma-separated sort keys; prefix a key with '-' for descending order.
      schema:
        type: string
        default: name
        example: -applicationOpensAt,name
    SpecialtySort:
      name: sort
