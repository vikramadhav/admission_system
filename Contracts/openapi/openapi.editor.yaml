      summary: Start an application withdrawal request
      description: 'Records the withdrawal reason and sends a one-time code to the registered email and mobile. The application is not withdrawn until confirmApplicationWithdrawal succeeds. reasonCode comes from lookup WITHDRAWAL_REASON; otherReason is required for OTHER, at least 3 letters, and placeholder words such as "Reason" or "NA" are rejected with 422. Success: 202 with request ID and OTP state. Empty: not applicable. Error: 409 when the status is not withdrawable (Draft, Withdrawn, Archived), 422 invalid reason, 503 when OTP delivery is unavailable, otherwise standard Problem response. BRD: US-1.2.4 AC1-AC3. Roles (active role): CANDIDATE.'
      security:
      - IdamBearer: []
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reasonCode
              properties:
                reasonCode:
                  type: string
                  minLength: 1
                  maxLength: 50
                otherReason:
                  type:
                  - string
                  - 'null'
                  minLength: 3
                  maxLength: 500
              allOf:
              - if:
                  required:
                  - reasonCode
                  properties:
                    reasonCode:
                      const: OTHER
                then:
                  required:
                  - otherReason
                  properties:
                    otherReason:
                      type: string
      responses:
        '202':
          description: OTP confirmation has been initiated.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
