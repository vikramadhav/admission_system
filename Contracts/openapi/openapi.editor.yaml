    AttachmentSlot:
      type: object
      description: One document required, optional, or permitted for this application under its current form schema and answers. Slots are generated by the server (for example, one personal-statement slot per selected specialty and training site) and change when preferences or conditional answers change. Hidden documents are not returned.
      additionalProperties: false
      required:
      - slotId
      - sectionKey
      - documentTypeCode
      - label
      - required
      - editable
      - allowedMediaTypes
      - maxFileSizeBytes
      - attachment
      properties:
        slotId:
          type: string
          description: Opaque slot identifier used in upload, delete, and download paths.
        sectionKey:
          type: string
          description: Application section, or `portfolio`, that displays this slot.
        documentTypeCode:
          type: string
          description: Stable configured document type, for example CV or PERSONAL_STATEMENT.
          example: PERSONAL_STATEMENT
        label:
          type: string
        required:
          type: boolean
          description: Whether a file must be present before payment and submission.
        editable:
          type: boolean
          description: Whether the caller may upload or delete now. True for draft slots, only flagged slots while correction is required, and portfolio evidence until the portfolio is submitted.
        allowedMediaTypes:
          type: array
          minItems: 1
          items:
            type: string
          example:
          - application/pdf
        maxFileSizeBytes:
          type: integer
          minimum: 1
          example: 2097152
        specialtyId:
          type:
          - string
          - 'null'
          description: Set for documents required per specialty preference.
          format: uuid
        trainingSiteId:
          type:
          - string
          - 'null'
          description: Set for documents required per specialty and training site.
          format: uuid
        portfolioQuestionId:
          type:
          - string
          - 'null'
          description: Set for portfolio evidence slots.
          format: uuid
        attachment:
          description: Current active file, or null when nothing has been uploaded.
          oneOf:
          - $ref: '#/components/schemas/AttachmentMetadata'
          - type: 'null'
