openapi: 3.1.0

info:
  title: MBRU Unified Admission Platform API
  version: 0.10.0
  summary: Modular API contract covering GME Release 5 user stories.
  description: >-
    Contract for the GME Release 5 user stories, aligned with the DAHC engineering
    standard (decisions D-01 to D-21 in Open-Questions.md). Success responses use
    the ApiResponse envelope; errors are top-level RFC 7807 Problem documents with
    dotted codes. Callers send an IDAM access token; authorization uses the internal
    active role listed in each operation (x-dahc-roles), never OAuth scopes. Resources
    are addressed by UUID; candidate and application numbers are display fields. Coverage
    does not mean unresolved business rules are approved or that the APIs are implemented.
    Not an MBBS or interview API.
  contact:
    name: Admission Platform API Contract Owners

servers:
  - url: /
    description: >-
      Relative to the API host configured for the environment. Paths start with /api/v1.

tags:
  - name: Identity
  - name: Administration
  - name: Catalog
  - name: Applications
  - name: Candidate Lifecycle
  - name: Payments
  - name: Admission Operations
  - name: Portfolio Scoring
  - name: Screening and Announcements

