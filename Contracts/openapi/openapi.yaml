components:
  securitySchemes:
    IdamBearer:
      type: http
      scheme: bearer
      description: >-
        Opaque IDAM access token in the Authorization header, validated by IDAM introspection
        (RFC 7662). Only tokens issued to registered DAHC clients are accepted; ID
        tokens never are. Identity comes from introspection and UserInfo only. Authorization
        uses internal roles (x-dahc-roles) and, for middleware, internal integration
        permissions (x-dahc-integration-permission). 401 for a missing, inactive or
        rejected token; 503 when IDAM is unreachable (fails closed).

security:
  - IdamBearer: []

externalDocs:
  description: Shared API conventions, authentication decisions, and implementation
