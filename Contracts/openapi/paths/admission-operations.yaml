    operationId: recommendApplicationScreenOut
    summary: Recommend screening out an application
    description: >-
      The assigned officer recommends a screen-out with a mandatory reason from lookup
      SCREEN_OUT_REASON and an optional note. Verification status becomes Screen Out
      Pending Approval, the supervisor is notified and the application leaves the
      officer's inbox until decided. Success: 202 with workflow result. Empty: not
      applicable. Error: 409 when not in an actionable verification state, 422 unknown
      reason, otherwise standard Problem response. BRD: US-2.4.1. Roles (active role):
      ADMISSION_OFFICER.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - reasonCode
            properties:
              reasonCode:
                type: string
                minLength: 1
              note:
                type:
                  - string
                  - "null"
                maxLength: 500
    responses:
      "202":
        description: Screen-out recommendation awaits supervisor decision.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/WorkflowActionResult"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - ADMISSION_OFFICER

/api/v1/staff/applications/{applicationId}/screen-out-decisions:
  post:
