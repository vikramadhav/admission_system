        in: query
        style: form
        explode: true
        schema:
          type: array
          uniqueItems: true
          items:
            $ref: "../components/schemas.yaml#/ReinstatementRequestStatus"
          default:
            - SUBMITTED
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
      - name: sort
        in: query
        description: >-
          Allow-listed sort keys, comma-separated; prefix with - for descending. Allowed:
