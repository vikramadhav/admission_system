/api/v1/staff/admission/dashboard:
  get:
    tags:
      - Admission Operations
    operationId: getAdmissionOfficerDashboard
    summary: Get the officer's pool insights, queue insights and inbox
    description: >-
      Returns pool insights for the officer's assigned pools (summed), personal-queue
      insights, and the inbox of applications the officer retrieved, oldest due date
      first. insight filters the inbox to one personal-queue category. Training sites
      and the portfolio are never returned. Success: 200 with OfficerDashboard. Empty:
      200 with zero counts and an empty data list and a messageCode. Error: standard
      Problem response. BRD: US-2.1.1, US-2.1.2. Roles (active role): ADMISSION_OFFICER.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/CycleIdOptional"
      - name: insight
        in: query
        schema:
          $ref: "../components/schemas.yaml#/OfficerInsight"
      - name: verificationStatus
        in: query
        schema:
          $ref: "../components/schemas.yaml#/VerificationStatus"
      - name: q
        in: query
        description: Free-text search over application number and candidate name.
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
      - name: sort
        in: query
        description: >-
          Allow-listed sort keys, comma-separated; prefix with - for descending. Allowed:
          dueAt, retrievedAt, submittedAt, applicationId, candidateName, verificationStatus,
          gpaShortlistingScore, examShortlistingScore. Unsupported keys return 400
          request.invalid_sort.
        schema:
          type: string
          default: dueAt
    responses:
      "200":
        description: Officer dashboard.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/OfficerDashboard"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - ADMISSION_OFFICER

/api/v1/staff/supervisor/dashboard:
  get:
    tags:
      - Admission Operations
    operationId: getAdmissionSupervisorDashboard
    summary: Get the supervisor dashboard
    description: >-
      Supervisor-only. Returns all-pools insights, the supervisor's queue insights,
      the inbox of escalations, screen-out recommendations and reinstatement requests
      (paged), and the officers' and referees' workload panels. Filters apply to every
      component; without filters all programs and specialties are included. Success:
      200 with SupervisorDashboard. Empty: 200 with zero counts and empty lists. Error:
      standard Problem response. BRD: US-2.1.3, US-2.2.2 AC1-AC2. Roles (active role):
      ADMISSION_SUPERVISOR.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/CycleIdOptional"
      - name: programId
        in: query
        schema:
          type: string
          format: uuid
      - name: specialtyId
        in: query
        schema:
          type: string
          format: uuid
      - name: queue
        in: query
        description: Filters the inbox.
        schema:
          type: string
          enum:
            - ESCALATION
            - SCREEN_OUT
            - REINSTATEMENT
      - name: q
        in: query
        description: Free-text search over application number and candidate name in
          the inbox.
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
      - name: sort
        in: query
        description: >-
          Allow-listed sort keys, comma-separated; prefix with - for descending. Allowed:
          requestedAt, applicationId, candidateName, queue. Unsupported keys return
          400 request.invalid_sort.
        schema:
          type: string
          default: requestedAt
    responses:
      "200":
        description: Supervisor dashboard.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/SupervisorDashboard"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - ADMISSION_SUPERVISOR

/api/v1/staff/site-monitoring/dashboard:
  get:
    tags:
      - Admission Operations
    operationId: getCentralSiteMonitoringDashboard
    summary: Get the Central Monitor site dashboard
    description: >-
      Read-only for the Central Monitor and supervisors. Returns all-pools insights
      (sites not considered) and the three site charts: interest by specialty (occurrence
      counting), applications by status and applications by program (unique application-site
      counting). Defaults to the current cycle, all programs and sites. Success: 200
      with SiteMonitoringDashboard. Empty: 200 with zero counts and empty series.
      Error: standard Problem response. BRD: US-2.1.4. Roles (active role): CENTRAL_MONITOR,
      ADMISSION_SUPERVISOR.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/CycleIdOptional"
      - name: programId
        in: query
        schema:
          type: string
          format: uuid
      - name: siteId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Site monitoring aggregates.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/SiteMonitoringDashboard"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CENTRAL_MONITOR
      - ADMISSION_SUPERVISOR

/api/v1/staff/pools/{poolId}/application-retrievals:
  post:
    tags:
      - Admission Operations
    operationId: retrieveApplicationsFromPool
    summary: Retrieve applications from an assigned verification pool
    description: >-
      Retrieves eligible submissions within the configured cap and fairness rules,
      atomically assigning them and setting due dates/status. Success: 200 with retrieved
      WorkItemList. Empty: 200 with an empty data list and a messageCode if pool is
      empty; cap exhaustion returns 409. Error: standard Problem response. BRD: US-2.2.1.
      Roles (active role): ADMISSION_OFFICER.
    security:
      - IdamBearer: []
    parameters:
      - name: poolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: requestedCount
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    responses:
      "200":
        description: Retrieved work items; may be empty when pool has no eligible
          cases.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiListResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "../components/schemas.yaml#/WorkItem"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - ADMISSION_OFFICER

/api/v1/staff/officers/{officerId}/workload:
  get:
    tags:
      - Admission Operations
    operationId: getOfficerWorkload
    summary: Inspect an officer's queue and applications
    description: >-
      Supervisor-only second level of the Officers Workload panel: the officer's queue
      insights and every application assigned to them with all dates and the overdue
      flag (due date passed and still In Progress). Success: 200 with OfficerWorkload.
      Empty: 200 with zero counts and an empty data list and a messageCode. Error:
      404 unknown officer, otherwise standard Problem response. BRD: US-2.2.2, US-2.2.3
      AC2. Roles (active role): ADMISSION_SUPERVISOR.
    security:
      - IdamBearer: []
    parameters:
      - name: officerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "../components/parameters.yaml#/CycleIdOptional"
      - name: submissionDateFrom
        in: query
        schema:
          type: string
          format: date
      - name: submissionDateTo
        in: query
        schema:
          type: string
          format: date
      - name: overdue
        in: query
        schema:
          type: boolean
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
      - name: sort
        in: query
        description: >-
          Allow-listed sort keys, comma-separated; prefix with - for descending. Allowed:
          dueAt, retrievedAt, submittedAt, applicationId, candidateName, verificationStatus,
          gpaShortlistingScore, examShortlistingScore. Unsupported keys return 400
          request.invalid_sort.
        schema:
          type: string
          default: dueAt
    responses:
      "200":
        description: Officer workload.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/OfficerWorkload"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - ADMISSION_SUPERVISOR

/api/v1/staff/applications/{applicationId}/assignment:
  put:
    tags:
      - Admission Operations
    operationId: reassignApplicationToOfficer
    summary: Reassign an eligible application to another officer
    description: >-
      Supervisor reassigns only an eligible case to an officer in the same program/first-specialty
      pool, requiring a justification. Success: 200 with updated assignment. Empty:
      not applicable. Error: 409 when status changed or target is not eligible, 422
      invalid justification, or standard Problem response. BRD: US-2.2.3. Roles (active
      role): ADMISSION_SUPERVISOR.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/AssignmentRequest"
    responses:
      "200":
        description: Assignment updated and target officer notified.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/WorkItem"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - ADMISSION_SUPERVISOR

/api/v1/staff/applications/{applicationId}:
  get:
    tags:
      - Admission Operations
    operationId: getApplicationForVerification
    summary: Read an application assigned to the officer
    description: >-
      Read-only application view for the assigned officer, supervisors (including
      reinstatement review) and the Central Monitor. Portfolio data is always excluded
      and training sites are hidden from officers. Attachments are listed with listApplicationAttachmentsForStaff.
      Success: 200 with Application. Empty: 404 when missing or outside caller scope.
      Error: standard Problem response. BRD: US-2.3.1, US-2.1.4 AC12, US-2.5.1 AC3.
      Roles (active role): ADMISSION_OFFICER, ADMISSION_SUPERVISOR, CENTRAL_MONITOR.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
    responses:
      "200":
        description: Verification view with portfolio section excluded.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/Application"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - ADMISSION_OFFICER
      - ADMISSION_SUPERVISOR
      - CENTRAL_MONITOR

/api/v1/staff/applications/{applicationId}/correction-flags:
  put:
    tags:
      - Admission Operations
    operationId: saveApplicationCorrectionFlags
    summary: Save flagged items and candidate-facing correction notes
    description: >-
      Saves the officer's item-level flags and approved candidate-facing notes without
      returning the application yet. Success: 200 with flags. Empty: not applicable.
      Error: 409 when not in a reviewable state, 422 for invalid flags, or standard
      Problem response. BRD: US-2.3.2. Roles (active role): ADMISSION_OFFICER.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/CorrectionFlagSet"
    responses:
      "200":
        description: Saved correction flags.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/CorrectionFlagSet"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - ADMISSION_OFFICER

/api/v1/staff/applications/{applicationId}/correction-requests:
  post:
    tags:
      - Admission Operations
    operationId: returnApplicationForCorrection
    summary: Return an application to the candidate for correction
    description: >-
      Applies Correction Required only when at least one valid flag exists; exposes
      only flagged sections to the candidate and assigns the return to the same officer
      on resubmission. Success: 200 with workflow result. Empty: not applicable. Error:
      409 invalid state, 422 missing flags, or standard Problem response. BRD: US-2.3.3.
      Roles (active role): ADMISSION_OFFICER.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - correctionDeadline
            properties:
              correctionDeadline:
                type: string
                format: date-time
    responses:
      "200":
        description: Application returned for correction.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/WorkflowActionResult"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - ADMISSION_OFFICER

/api/v1/applications/{applicationId}/corrections:
  post:
    tags:
      - Candidate Lifecycle
    operationId: submitApplicationCorrections
    summary: Submit corrections to flagged application items
    description: >-
      Candidate may update only flagged fields/attachments and resubmits to the same
      officer. Portfolio is immutable. Success: 200 with workflow result. Empty: not
      applicable. Error: 409 when not awaiting correction, 422 for incomplete correction,
      or standard Problem response. BRD: US-2.3.4. Roles (active role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - sections
            properties:
              sections:
                type: object
                description: Only previously flagged section keys are accepted.
                additionalProperties:
                  $ref: "../components/schemas.yaml#/ApplicationSectionInput"
    responses:
      "200":
        description: Corrections submitted to the original officer.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/WorkflowActionResult"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - CANDIDATE

/api/v1/staff/applications/{applicationId}/verification-completion:
  post:
    tags:
      - Admission Operations
    operationId: completeApplicationVerification
    summary: Complete the verification workstream
    description: >-
      Marks verification complete without prematurely completing the application if
      portfolio scoring is outstanding. Success: 200 with workflow result. Empty:
      not applicable. Error: 409 if verification cannot complete in current state,
      422 for missing checks, or standard Problem response. BRD: US-2.3.5. Roles (active
      role): ADMISSION_OFFICER.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - confirmed
            properties:
              confirmed:
                const: true
    responses:
      "200":
        description: Verification marked complete.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/WorkflowActionResult"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - ADMISSION_OFFICER

/api/v1/staff/applications/{applicationId}/verification-actions:
  post:
    tags:
      - Admission Operations
    operationId: handleVerificationActionAfterSupervisorFeedback
    summary: Continue verification after supervisor feedback
    description: >-
      Assigned officer selects a permitted next action after screen-out rejection,
      such as correction, complete verification, screen-out recommendation, or clarification
      escalation. Success: 200 with workflow result. Empty: not applicable. Error:
      409 if the current state does not permit the requested action, otherwise standard
      Problem response. BRD: US-2.4.5. Roles (active role): ADMISSION_OFFICER.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - action
            properties:
              action:
                type: string
                enum:
                  - RETURN_FOR_CORRECTION
                  - COMPLETE_VERIFICATION
                  - RECOMMEND_SCREEN_OUT
                  - ESCALATE_FOR_CLARIFICATION
              reasonCode:
                type: string
              note:
                type: string
                maxLength: 500
    responses:
      "200":
        description: Selected verification action applied.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/WorkflowActionResult"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - ADMISSION_OFFICER

/api/v1/staff/applications/{applicationId}/attachments/{attachmentId}/replacement:
  put:
    tags:
      - Admission Operations
    operationId: replaceApplicationAttachment
    summary: Replace an application attachment during verification
    description: >-
      Replaces an attachment while preserving its prior version and audit history.
      Success: 200 with new attachment metadata. Empty: not applicable. Error: 409
      if state prohibits replacement, 413/415 for file constraints, or standard Problem
      response. BRD: US-2.3.6. Roles (active role): ADMISSION_OFFICER.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
              - reason
            properties:
              file:
                type: string
                format: binary
              reason:
                type: string
                minLength: 1
                maxLength: 500
                description: Mandatory justification for the replacement (US-2.3.6
                  AC2).
    responses:
      "200":
        description: New attachment version stored.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/AttachmentMetadata"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
