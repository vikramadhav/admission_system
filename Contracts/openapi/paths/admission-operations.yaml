    operationId: listReinstatementRequests
    summary: List reinstatement requests
    description: >-
      Supervisor-only queue, separate from verification pools. Defaults to pending
      (SUBMITTED) requests in request-date order; pass status and omit cycleId to
      see historical requests from past cycles. Success: 200 with ReinstatementRequestList.
      Empty: 200 with an empty data list and a messageCode. Error: standard Problem
      response. BRD: US-2.5.1 AC1-AC2, note 3. Roles (active role): ADMISSION_SUPERVISOR.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/CycleIdOptional"
