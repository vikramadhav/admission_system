      - Admission Operations
    operationId: decideApplicationScreenOut
    summary: Endorse or reject a screen-out recommendation
    description: >-
      Supervisor makes an auditable decision. Endorsement needs no note and may change
      the reason; it sets application and verification status to Screened Out and
      announcement status to Announced, and notifies the candidate with the reason.
      Rejection needs a note, sets verification status to Re-evaluating and returns
      the case to the same officer. Success: 200 with workflow result. Empty: not
      applicable. Error: 409 state conflict, 422 invalid decision or missing note,
      or standard Problem response. BRD: US-2.4.3, STP-2.4 rule 3. Roles (active role):
      ADMISSION_SUPERVISOR.
