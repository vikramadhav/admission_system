/api/v1/staff/reinstatement-requests/{requestId}/decision:
  post:
    tags:
      - Admission Operations
    operationId: decideReinstatementRequest
    summary: Approve or reject a candidate reinstatement request
    description: >-
      Supervisor decision with a mandatory note; rejection also needs a reason from
      lookup REINSTATEMENT_REJECTION_REASON. Approval restores the application, verification
      and portfolio statuses from before the withdrawal and returns it to the same
      pool. Rejection keeps it Withdrawn. The candidate is emailed either way. Success:
      200 with workflow result. Empty: not applicable. Error: 409 reinstatement.already_decided
      or application.active_exists, 422 missing reason, otherwise standard Problem
      response. BRD: US-2.5.2, STP-2.5 rule 4. Roles (active role): ADMISSION_SUPERVISOR.
    security:
      - IdamBearer: []
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - decision
              - note
            properties:
              decision:
                type: string
                enum:
                  - APPROVE
                  - REJECT
              reasonCode:
                type:
                  - string
                  - "null"
                description: Required for REJECT.
              note:
                type: string
                minLength: 1
                maxLength: 500
            allOf:
              - if:
                  required:
                    - decision
                  properties:
                    decision:
                      const: REJECT
                then:
                  required:
                    - reasonCode
                  properties:
                    reasonCode:
                      type: string
                      minLength: 1
    responses:
      "200":
        description: Decision recorded and candidate notified.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/WorkflowActionResult"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - ADMISSION_SUPERVISOR

/api/v1/staff/candidates/{candidateId}/icp-refresh:
  post:
    tags:
      - Admission Operations
    operationId: refreshCandidateInformationFromIcp
    summary: Apply selected ICP values to the candidate
    description: >-
      Applies the ICP values captured by previewCandidateIcpRefresh for the selected
      fields only (Update All sends every differing field). ICP is not called again,
      so the stored data matches what the supervisor reviewed. Each change is recorded
      in the candidate change history with field, original value, new value, user
      and time (D-06); the audit log records the action only, never values. The token
      is single-use and bound to the candidate, the reason and the supervisor. Success:
      200 with the applied field names. Empty: not applicable. Error: 409 icp.preview_invalid
      when the token is expired, used or issued for another candidate, reason or user;
      409 icp.preview_stale when stored data changed after the preview; 422 when a
      field was not in the preview or did not differ; otherwise standard Problem response.
      BRD: US-2.5.3 AC8-AC13. Roles (active role): ADMISSION_SUPERVISOR.
    security:
      - IdamBearer: []
    parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - requestReason
              - previewToken
              - fieldCodes
              - confirmed
            properties:
              requestReason:
                type: string
                enum:
                  - IDENTITY_EXPIRY
                  - DETAILS_CHANGE
                description: Must match the reason used for the preview.
              previewToken:
                type: string
                minLength: 1
                maxLength: 512
              fieldCodes:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
              confirmed:
                const: true
    responses:
      "200":
        description: Selected fields updated.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                        - refreshedAt
                        - changedFields
                        - auditEventId
                      properties:
                        refreshedAt:
                          type: string
                          format: date-time
                        changedFields:
                          type: array
                          items:
                            type: string
                        auditEventId:
                          type: string
                          format: uuid
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - ADMISSION_SUPERVISOR

/api/v1/staff/candidates/{candidateId}/icp-refresh-preview:
  post:
    tags:
      - Admission Operations
    operationId: previewCandidateIcpRefresh
    summary: Compare stored candidate data with the latest ICP data
    description: >-
      Supervisor-only. Calls ICP through the integration middleware and returns only
      the ICP-sourced fields, each with the current value, the latest ICP value and
      whether they differ. Nothing is changed. The ICP values are held server-side
      with a short-lived, single-use preview token used to apply them. Success: 200
      with the comparison. Empty: 200 with differencesFound=false and null previewToken
      when nothing differs ("no updates are required"). Error: 503 when ICP or the
      middleware is unavailable (no data changed), otherwise standard Problem response.
      BRD: US-2.5.3 AC3-AC7, AC14-AC16. Roles (active role): ADMISSION_SUPERVISOR.
    security:
      - IdamBearer: []
    parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - requestReason
            properties:
              requestReason:
                type: string
                enum:
                  - IDENTITY_EXPIRY
                  - DETAILS_CHANGE
    responses:
      "200":
        description: Field-by-field comparison; no candidate data is changed.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                        - differencesFound
                        - previewToken
                        - expiresAt
                        - fields
                      properties:
                        differencesFound:
                          type: boolean
                        previewToken:
                          type:
                            - string
                            - "null"
                          description: >-
                            Single-use token for refreshCandidateInformationFromIcp.
                            Null when nothing differs.
                        expiresAt:
                          type:
                            - string
                            - "null"
                          format: date-time
                          description: When the preview token expires. Null when nothing
                            differs.
                        fields:
                          type: array
                          items:
                            $ref: "../components/schemas.yaml#/IcpFieldComparison"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - ADMISSION_SUPERVISOR

