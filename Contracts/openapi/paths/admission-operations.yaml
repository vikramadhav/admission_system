                      type: array
                      items:
                        $ref: "../components/schemas.yaml#/ApplicationAttachment"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - ADMISSION_OFFICER
      - ADMISSION_SUPERVISOR
      - CENTRAL_MONITOR

/api/v1/staff/applications/{applicationId}/attachments/{attachmentId}/content:
  get:
    tags:
      - Admission Operations
    operationId: downloadApplicationAttachmentForStaff
    summary: View or download an application attachment
    description: >-
      Streams the file from FileNet through the API; no FileNet location is exposed.
      Without version the active version is returned; earlier versions are available
      to supervisors for audit. Each download is audited. Success: 200 with the file.
      Empty: not applicable. Error: 404 when missing or outside caller scope, 503
      when FileNet or Rhapsody is unavailable, otherwise standard Problem response.
      BRD: US-2.3.1 AC7, US-2.3.6 note 3. Roles (active role): ADMISSION_OFFICER,
      ADMISSION_SUPERVISOR, CENTRAL_MONITOR.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: query
        description: Earlier version number; supervisors only.
        schema:
          type: integer
          minimum: 1
    responses:
      "200":
        description: Attachment content.
        headers:
          Content-Disposition:
            description: attachment; filename of the stored file.
            schema:
              type: string
          Cache-Control:
            description: Always private, no-store.
            schema:
              type: string
              const: private, no-store
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - ADMISSION_OFFICER
      - ADMISSION_SUPERVISOR
      - CENTRAL_MONITOR

/api/v1/staff/reinstatement-requests/{requestId}:
  get:
    tags:
      - Admission Operations
    operationId: getReinstatementRequest
    summary: Read a reinstatement request
    description: >-
      Supervisor-only. Returns the withdrawal reason, the candidate's justification,
      the statuses before withdrawal and the staff notes. The application itself is
      read with getApplicationForVerification. Success: 200 with ReinstatementRequestDetail.
      Empty: 404 when missing. Error: standard Problem response. BRD: US-2.5.1 AC3-AC4,
      note 2. Roles (active role): ADMISSION_SUPERVISOR.
    security:
      - IdamBearer: []
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Reinstatement request.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/ReinstatementRequestDetail"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - ADMISSION_SUPERVISOR

/api/v1/staff/applications/{applicationId}/reinstatement:
  post:
    tags:
      - Admission Operations
    operationId: reinstateScreenedOutApplication
    summary: Directly reinstate a screened-out application
    description: >-
      Exceptional supervisor-only back-office action with a mandatory justification.
      Restores the application, verification and portfolio statuses from before the
      screen-out and returns the portfolio to the applicable referee pool. Success:
      200 with workflow result. Empty: not applicable. Error: 409 application.not_screened_out
      or application.active_exists, 422 invalid justification, otherwise standard
      Problem response. BRD: STP-2.5 rules 5-6, US-2.5.2 note 1. Roles (active role):
      ADMISSION_SUPERVISOR.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - justification
              - confirmed
            properties:
              justification:
                type: string
                minLength: 3
                maxLength: 500
              confirmed:
                const: true
    responses:
      "200":
        description: Application reinstated.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/WorkflowActionResult"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - ADMISSION_SUPERVISOR

/api/v1/staff/duplicate-accounts:
  get:
    tags:
      - Admission Operations
    operationId: listDuplicateAccountPairs
    summary: List detected duplicate candidate accounts
    description: >-
      Supervisor-only report of account pairs the platform matched on mobile number,
      Emirates ID or passport after IDAM registration. Matched values are never returned.
      Success: 200 with DuplicateAccountPairList. Empty: 200 with an empty data list
      and a messageCode. Error: standard Problem response. BRD: US-1.1.1 AC4-AC6.
      Roles (active role): ADMISSION_SUPERVISOR.
    security:
      - IdamBearer: []
    parameters:
      - name: detectedFrom
        in: query
        schema:
          type: string
          format: date
      - name: detectedTo
        in: query
        schema:
          type: string
          format: date
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
      - name: sort
        in: query
        description: >-
          Allow-listed sort keys, comma-separated; prefix with - for descending. Allowed:
          detectedAt. Unsupported keys return 400 request.invalid_sort.
        schema:
          type: string
          default: -detectedAt
    responses:
      "200":
        description: Duplicate account pairs.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiListResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "../components/schemas.yaml#/DuplicateAccountPair"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - ADMISSION_SUPERVISOR
