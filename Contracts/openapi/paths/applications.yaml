/api/v1/applications:
  get:
    tags:
      - Applications
    operationId: listCandidateApplications
    summary: List the authenticated candidate's applications
    description: >-
      Always limits results to the authenticated candidate; caller-supplied candidate
      IDs are not accepted. Success: 200 with a paginated ApplicationList. Empty:
      200 with an empty data list and a messageCode and page.nextCursor=null. Error:
      standard Problem response. GME BRD traceability: US-1.2.1, US-1.2.2. Roles (active
      role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/CycleIdOptional"
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
      - name: sort
        in: query
        required: false
        description: Allow-listed sort keys; prefix a key with '-' for descending
          order.
        schema:
          type: string
          default: -createdAt
          example: -createdAt,id
    responses:
      "200":
        description: Paginated applications owned by the authenticated candidate.
        headers:
          X-Request-ID:
            $ref: "../components/responses.yaml#/headers/RequestId"
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiListResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "../components/schemas.yaml#/ApplicationSummary"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CANDIDATE
  post:
    tags:
      - Applications
    operationId: createCandidateDraftApplication
    summary: Create a draft application
    description: >-
      Creates a draft for the authenticated candidate after validating the cycle,
      program, candidate eligibility, specialty preferences, and sites. Success: 201
      with the created Application and ETag. Empty: not applicable. Error: 409 if
      an active application already exists for the cycle or an idempotency key is
      reused with a different request; 422 for business validation; otherwise standard
      Problem responses. GME BRD traceability: US-1.2.1, US-1.3.1. Roles (active role):
      CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Unique client-generated key for safe retries of this create operation.
        schema:
          type: string
          minLength: 16
          maxLength: 128
      - $ref: "../components/parameters.yaml#/CycleId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/CreateApplicationRequest"
    responses:
      "201":
        description: Draft created.
        headers:
          ETag:
            description: Opaque resource version required in If-Match for updates.
            schema:
              type: string
          X-Request-ID:
            $ref: "../components/responses.yaml#/headers/RequestId"
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/Application"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CANDIDATE

/api/v1/applications/{applicationId}:
  get:
    tags:
      - Applications
    operationId: getCandidateApplication
    summary: Get an application owned by the authenticated candidate
    description: >-
      Success: 200 with Application and ETag. Empty: a missing application or one
      not visible to the caller returns 404 Problem; the API does not disclose whether
      another candidate owns it. Error: standard Problem response. Submitted applications
      are returned read-only. GME BRD traceability: US-1.2.2. Roles (active role):
      CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - name: applicationId
        in: path
        required: true
        description: Opaque application identifier.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          format: uuid
    responses:
      "200":
        description: Application owned by the authenticated candidate.
        headers:
          ETag:
            description: Opaque resource version.
            schema:
              type: string
          X-Request-ID:
            $ref: "../components/responses.yaml#/headers/RequestId"
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/Application"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CANDIDATE
  patch:
    tags:
      - Applications
    operationId: updateCandidateDraftApplication
    summary: Save changes to an application draft
    description: >-
      Applies JSON Merge Patch only to the authenticated candidate's draft and only
      to fields currently editable under program configuration. Success: 200 with
      updated Application and new ETag. Empty: not applicable. Error: 404 for missing/not-visible
      resource, 409 if the current status is not editable, 412 for stale If-Match,
      422 for field/business validation, or standard Problem responses. GME BRD traceability:
      US-1.3.11. Roles (active role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - name: applicationId
        in: path
        required: true
        description: Opaque application identifier.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          format: uuid
      - name: If-Match
        in: header
        required: true
        description: ETag from the latest read or write to prevent lost updates.
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/merge-patch+json:
          schema:
            $ref: "../components/schemas.yaml#/UpdateDraftRequest"
    responses:
      "200":
        description: Draft saved; returns the new representation and resource version.
        headers:
          ETag:
            description: New opaque resource version.
            schema:
              type: string
          X-Request-ID:
            $ref: "../components/responses.yaml#/headers/RequestId"
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/Application"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "412":
        $ref: "../components/responses.yaml#/PreconditionFailed"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "428":
        $ref: "../components/responses.yaml#/PreconditionRequired"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CANDIDATE
