/api/v1/me/dashboard:
  get:
    tags:
      - Candidate Lifecycle
    operationId: getCandidateDashboard
    summary: Get the authenticated candidate's dashboard
    description: >-
      Returns the candidate's applications in inbox form with the actions each one
      allows now, and whether "Start New Application" is enabled and why not. Scores
      are included only after the applicable announcement; internal statuses and round
      scores are never returned. Success: 200 with CandidateDashboard. Empty: 200
      with an empty data list and a messageCode and the start-new state. Error: standard
      Problem response. BRD: US-1.2.1, US-1.2.2, US-4.3.2. Roles (active role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/CycleIdOptional"
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
      - name: sort
        in: query
        description: >-
          Allow-listed sort keys, comma-separated; prefix with - for descending. Allowed:
          createdAt, submittedAt. Unsupported keys return 400 request.invalid_sort.
        schema:
          type: string
          default: -createdAt
    responses:
      "200":
        description: Candidate dashboard.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/CandidateDashboard"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CANDIDATE

/api/v1/applications/{applicationId}/sections/{sectionKey}:
  get:
    tags:
      - Applications
    operationId: getApplicationSection
    summary: Read an application section
    description: >-
      Returns the section schema and values visible to the authenticated candidate.
      Success: 200 with ApplicationSection. Empty: 404 if the section does not apply
      or is not visible. Error: standard Problem response. BRD: US-1.3.2 through US-1.3.9.
      Roles (active role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - $ref: "../components/parameters.yaml#/SectionKey"
    responses:
      "200":
        description: Section values and editability for this application state.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/ApplicationSection"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CANDIDATE
  put:
    tags:
      - Applications
    operationId: saveApplicationSection
    summary: Save a program-specific application section
    description: >-
      Saves the supplied section after applying the versioned program form rules,
      conditional requirements, candidate ownership, and current-state editability.
      Success: 200 with saved section and new ETag. Empty: not applicable. Error:
      404 missing/not visible, 409 not editable, 412 stale version, 422 invalid section
      values, or standard Problem response. BRD: US-1.3.2 through US-1.3.9 and US-2.3.4
      for permitted corrections. Roles (active role): CANDIDATE. The personal-information
      section reads and writes the candidate's personal profile, which is shared by
      all their applications (D-10); each application keeps a snapshot of it as submitted
      (D-15).
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - $ref: "../components/parameters.yaml#/SectionKey"
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/ApplicationSectionInput"
    responses:
      "200":
        description: Section saved.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/ApplicationSection"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "412":
        $ref: "../components/responses.yaml#/PreconditionFailed"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "428":
        $ref: "../components/responses.yaml#/PreconditionRequired"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CANDIDATE

/api/v1/applications/{applicationId}/form-schema:
  get:
    tags:
      - Applications
    operationId: getApplicationFormSchema
    summary: Get the versioned, program-specific application form schema
    description: >-
      Returns the sections, field codes, types, visibility, editability, requiredness,
      options, conditional dependencies, and constraints applicable to this application.
      The same schema version is used by the UI and server validation. Success: 200
      with ApplicationFormSchema. Empty: 404 if application is missing or not visible.
      Error: standard Problem response. BRD: US-1.3.2 through US-1.3.10. Roles (active
      role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
    responses:
      "200":
        description: Applicable form schema and version.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/ApplicationFormSchema"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CANDIDATE

/api/v1/applications/{applicationId}/attachments:
  get:
    tags:
      - Applications
    operationId: listApplicationAttachmentSlots
    summary: List the attachment slots and current files for an application
    description: >-
      Returns every document slot that currently applies to the authenticated candidate's
      application, with requiredness, editability, file constraints, and the active
      file if one was uploaded. Slots reflect the current form schema, preferences,
      and conditional answers. Success: 200 with AttachmentSlotList. Empty: 200 with
      an empty data list and a messageCode when no documents apply. Error: 404 when
      the application is missing or not owned by the caller, otherwise standard Problem
      response. BRD: US-1.3.2 through US-1.3.10, US-2.3.4. Roles (active role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
    responses:
      "200":
        description: Applicable attachment slots; no applicable documents is an empty
          success.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiListResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "../components/schemas.yaml#/AttachmentSlot"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - CANDIDATE

/api/v1/applications/{applicationId}/attachments/{slotId}:
  put:
    tags:
      - Applications
    operationId: uploadApplicationAttachment
    summary: Upload or replace the file in an attachment slot
    description: >-
      The browser sends the file to this API only; it never calls the document integration
      directly. The service checks ownership and slot editability, validates media
      type and size against the slot, scans for malware, and stores the file through
      the Rhapsody integration in FileNet using the approved naming convention. Success
      is returned only after storage is confirmed. A replaced file is kept as a prior
      version for audit. Portfolio evidence attachmentIds returned here are the evidenceIds
      used in portfolio submission. Success: 200 with the new active AttachmentMetadata.
      Empty: not applicable. Error: 404 missing or not owned, 409 slot not editable
      in the current state, 413 too large, 415 disallowed type, 422 rejected content
      such as an empty or infected file, 503 when the document integration is unavailable
      (slot unchanged), or standard Problem response. BRD: US-1.3.2 through US-1.3.10,
      US-2.3.4. Roles (active role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - $ref: "../components/parameters.yaml#/AttachmentSlotId"
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required:
              - file
            properties:
              file:
                type: string
                format: binary
    responses:
      "200":
        description: File stored and set as the active attachment for the slot.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/AttachmentMetadata"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "413":
        description: File exceeds the slot's maximum size.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
      "415":
        description: File type is not allowed for the slot.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CANDIDATE
  delete:
    tags:
      - Applications
    operationId: deleteApplicationAttachment
    summary: Remove the active file from an attachment slot
    description: >-
      Clears the slot's active file when the slot is editable. The removed file is
      retained under the approved retention and audit policy rather than destroyed
      immediately. Requiredness is enforced at payment and submission, not here. Success:
      200 with the updated AttachmentSlot (attachment=null). Empty: 404 when the slot
      has no active file or the application is not owned by the caller. Error: 409
      slot not editable, 503 document integration unavailable, or standard Problem
      response. BRD: US-1.3.2 (AC18). Roles (active role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - $ref: "../components/parameters.yaml#/AttachmentSlotId"
    responses:
      "200":
        description: Active file removed from the slot.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/AttachmentSlot"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CANDIDATE

/api/v1/applications/{applicationId}/attachments/{slotId}/content:
  get:
    tags:
      - Applications
    operationId: downloadApplicationAttachment
    summary: Stream the active file in a slot for preview or download
    description: >-
      Streams the candidate's own active file from FileNet through this API; no FileNet
      or Rhapsody URL is exposed. Responses are not cacheable by shared caches. Success:
      200 with the file body. Empty: 404 when the slot has no active file or the application
      is not owned by the caller. Error: 503 document integration unavailable, or
      standard Problem response. BRD: US-1.3.2 (AC17). Roles (active role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - $ref: "../components/parameters.yaml#/AttachmentSlotId"
    responses:
      "200":
        description: Active file content.
        headers:
          Content-Disposition:
            description: Attachment or inline disposition with a safe file name.
            schema:
              type: string
          Cache-Control:
            description: Always `private, no-store`.
            schema:
              type: string
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CANDIDATE

/api/v1/applications/{applicationId}/portfolio:
  get:
    tags:
      - Applications
    operationId: getCandidatePortfolioDraft
    summary: Read the candidate's portfolio submission
    description: >-
      Returns the candidate's own portfolio draft or submitted content. Success: 200
      with the portfolio data. Empty: 404 when no portfolio is configured for this
      application. Error: standard Problem response. Submitted portfolio data is immutable.
      BRD: US-1.3.10. Roles (active role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
    responses:
      "200":
        description: Portfolio answers and evidence references.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/PortfolioSubmission"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - CANDIDATE

/api/v1/applications/{applicationId}/portfolio-submission:
  post:
    tags:
      - Applications
    operationId: submitCandidatePortfolio
    summary: Confirm and submit the one-time portfolio
    description: >-
      Validates all program-specific portfolio answers and evidence and irreversibly
      submits the portfolio. Success: 201 with immutable PortfolioSubmission. Empty:
      not applicable. Error: 409 if already submitted, 422 for incomplete or invalid
      answers, otherwise standard Problem response. BRD: US-1.3.10. Roles (active
      role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PortfolioSubmissionInput"
    responses:
      "201":
        description: Portfolio submitted and made immutable.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/PortfolioSubmission"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CANDIDATE

/api/v1/applications/{applicationId}/preferences:
  put:
    tags:
      - Candidate Lifecycle
    operationId: updateCandidatePreferences
    summary: Update application preferences before the configured deadline
    description: >-
      Replaces the candidate's preferences only when current status and cycle rules
      permit. Success: 200 with updated Application. Empty: not applicable. Error:
      409 when preferences are locked, 412 stale version, 422 invalid combinations,
      or standard Problem response. BRD: US-1.2.6. Roles (active role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - preferences
            properties:
              preferences:
                type: array
                minItems: 1
                maxItems: 2
                items:
                  $ref: "../components/schemas.yaml#/PreferenceInput"
    responses:
      "200":
        description: Updated preferences.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/Application"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "412":
        $ref: "../components/responses.yaml#/PreconditionFailed"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - CANDIDATE

/api/v1/applications/{applicationId}/site-exclusions:
  post:
    tags:
      - Candidate Lifecycle
    operationId: excludeCandidateTrainingSites
    summary: Exclude previously selected training sites
    description: >-
      Excludes only existing sites, requires a reason, preserves at least one site
      per specialty, and does not change application status. Success: 200 with updated
      Application. Empty: not applicable. Error: 409 for a locked application or invalid
      final-site exclusion, 422 for invalid request, or standard Problem response.
      BRD: US-1.2.8. Roles (active role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - siteIds
              - reason
            properties:
              siteIds:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
              reason:
                type: string
                minLength: 1
                maxLength: 500
    responses:
      "200":
        description: Sites excluded; application status remains unchanged.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/Application"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - CANDIDATE

/api/v1/applications/{applicationId}/withdrawal-requests:
  post:
    tags:
      - Candidate Lifecycle
    operationId: createApplicationWithdrawalRequest
    summary: Start an application withdrawal request
    description: >-
      Records the withdrawal reason and sends a one-time code to the registered email
      and mobile. The application is not withdrawn until confirmApplicationWithdrawal
      succeeds. reasonCode comes from lookup WITHDRAWAL_REASON; otherReason is required
      for OTHER, at least 3 letters, and placeholder words such as "Reason" or "NA"
      are rejected with 422. Success: 202 with request ID and OTP state. Empty: not
      applicable. Error: 409 when the status is not withdrawable (Draft, Withdrawn,
      Archived), 422 invalid reason, 503 when OTP delivery is unavailable, otherwise
      standard Problem response. BRD: US-1.2.4 AC1-AC3. Roles (active role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - reasonCode
            properties:
              reasonCode:
                type: string
                minLength: 1
                maxLength: 50
              otherReason:
                type:
                  - string
                  - "null"
                minLength: 3
                maxLength: 500
            allOf:
              - if:
                  required:
                    - reasonCode
                  properties:
                    reasonCode:
                      const: OTHER
                then:
                  required:
                    - otherReason
                  properties:
                    otherReason:
                      type: string
    responses:
      "202":
        description: OTP confirmation has been initiated.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                        - requestId
                        - expiresAt
                        - resendAvailableAt
                        - destinations
                      properties:
                        requestId:
                          type: string
                          format: uuid
                        expiresAt:
                          type: string
                          format: date-time
                        resendAvailableAt:
                          type: string
                          format: date-time
                        destinations:
                          type: array
                          items:
                            $ref: "../components/schemas.yaml#/OtpDestination"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - CANDIDATE

/api/v1/applications/{applicationId}/withdrawal-requests/{requestId}/confirmation:
  post:
    tags:
      - Candidate Lifecycle
    operationId: confirmApplicationWithdrawal
    summary: Confirm withdrawal using the issued OTP
    description: >-
      Verifies the one-time code and applies the withdrawal state transition once.
      Success: 200 with authoritative workflow result. Empty: not applicable. Error:
      409 for expired/consumed request, 422 invalid code, or standard Problem response.
      BRD: US-1.2.4. Roles (active role): CANDIDATE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/ApplicationId"
      - name: requestId
        in: path
        required: true
        schema:
          type: string
