/api/v1/programs:
  get:
    tags:
      - Catalog
    operationId: listPrograms
    summary: List programs open or configured for a cycle
    description: >-
      Returns only programs visible to the caller and eligible for application according
      to current configuration. Success: 200 with a paginated ProgramList. Empty:
      200 with an empty data list and a messageCode and page.nextCursor=null. Error:
      standard Problem response. GME BRD traceability: US-1.3.1. Roles (active role):
      any active signed-in user.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/CycleId"
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
      - $ref: "../components/parameters.yaml#/ProgramSort"
    responses:
      "200":
        description: Paginated program catalog; an empty catalog is a successful empty
          list.
        headers:
          X-Request-ID:
            $ref: "../components/responses.yaml#/headers/RequestId"
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiListResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "../components/schemas.yaml#/Program"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - ANY_ACTIVE_USER

/api/v1/programs/{programId}/specialties:
  get:
    tags:
      - Catalog
    operationId: listProgramSpecialties
    summary: List active specialties for a program
    description: >-
      Success: 200 with paginated active specialties. Empty: 200 with an empty data
      list and a messageCode when the program has no active specialties. Error: 404
      when the program is unknown or not visible, otherwise a standard Problem response.
      GME BRD traceability: US-1.3.1. Roles (active role): any active signed-in user.
    security:
      - IdamBearer: []
    parameters:
      - name: programId
        in: path
        required: true
        description: Opaque program identifier.
        schema:
          type: string
          format: uuid
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
      - $ref: "../components/parameters.yaml#/SpecialtySort"
    responses:
      "200":
        description: Paginated specialty list; no active specialties is an empty success.
        headers:
          X-Request-ID:
            $ref: "../components/responses.yaml#/headers/RequestId"
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiListResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "../components/schemas.yaml#/Specialty"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - ANY_ACTIVE_USER

