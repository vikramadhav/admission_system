/api/v1/lookups/{lookupType}:
  get:
    tags:
      - Catalog
    operationId: listLookupValues
    summary: List configured values for a workflow drop-down
    description: >-
      Returns the configured codes and labels behind workflow drop-downs, so clients
      never hard-code business lists. Candidate tokens may read WITHDRAWAL_REASON
      only; the other types are for staff and referee roles and return 403 to candidates.
      PORTFOLIO_REJECTION_REASON and PORTFOLIO_CLASSIFICATION are scoped by programId
      and, optionally, questionId (parentCode). Inactive values are excluded unless
      includeInactive=true. Success: 200 with LookupList. Empty: 200 with an empty
      data list and a messageCode when nothing is configured. Error: 400 for an unknown
      type or filter, otherwise standard Problem response. BRD: US-1.2.4, US-2.3.2,
      US-2.4.1, US-2.4.3, US-2.5.2, US-3.3.3, US-4.4.1, Appendix (Screen Out Reasons,
      Portfolio Rejection Reasons). Roles (active role): any active signed-in user.
    security:
      - IdamBearer: []
    parameters:
      - name: lookupType
        in: path
        required: true
        schema:
          type: string
          enum:
            - WITHDRAWAL_REASON
            - CORRECTION_NOTE_TEMPLATE
            - SCREEN_OUT_REASON
            - REINSTATEMENT_REJECTION_REASON
            - PORTFOLIO_REJECTION_REASON
            - PORTFOLIO_CLASSIFICATION
      - name: programId
        in: query
        description: Required for the PORTFOLIO_* types.
        schema:
          type: string
          format: uuid
      - name: questionId
        in: query
        description: Limits PORTFOLIO_* values to one question.
        schema:
          type: string
          format: uuid
      - name: includeInactive
        in: query
        schema:
          type: boolean
          default: false
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
    responses:
      "200":
        description: Configured lookup values.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiListResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "../components/schemas.yaml#/LookupItem"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - ANY_ACTIVE_USER
