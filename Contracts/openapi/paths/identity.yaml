/api/v1/admin/integration-clients:
  get:
    tags:
      - Administration
    operationId: listIntegrationClients
    summary: List integration clients
    description: >-
      Administrator-only list of third-party middleware registered as IDAM confidential
      clients, with their internal permissions. Success: 200 with a page. Empty: 200
      with an empty data list and a messageCode. Error: standard Problem response.
      Roles (active role): ADMINISTRATOR.
    security:
      - IdamBearer: []
    x-dahc-roles:
      - ADMINISTRATOR
    parameters:
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
    responses:
      "200":
        description: Integration clients.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiListResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "../components/schemas.yaml#/IntegrationClient"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
  post:
    tags:
      - Administration
    operationId: registerIntegrationClient
    summary: Register an integration client
    description: >-
      Administrator-only. Records a middleware's IDAM client id and internal permissions.
      Records are never created automatically and IDAM scopes or claims never grant
      a permission. Audited. Success: 201 with the client. Empty: not applicable.
      Error: 409 integration.already_registered, 422 unknown permission, otherwise
      standard Problem response. Roles (active role): ADMINISTRATOR.
    security:
      - IdamBearer: []
    x-dahc-roles:
      - ADMINISTRATOR
    parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/IntegrationClientInput"
    responses:
      "201":
        description: Integration client registered.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/IntegrationClient"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"

