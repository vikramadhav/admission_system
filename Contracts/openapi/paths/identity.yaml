/api/v1/admin/staff-users/{staffUserId}/roles:
  put:
    tags:
      - Administration
    operationId: setStaffUserRoles
    summary: Grant or revoke a staff user's roles and pool scopes
    description: >-
      Administrator-only. Replaces the user's staff roles and their program/specialty
      pool scopes. Refuses self-elevation. Removing the active role makes the next
      request fall back to the user's default role. Removing every role is refused:
      deactivate the user instead. Every change is audited (who, whom, which role,
      when). Success: 200 with the staff user. Empty: not applicable. Error: 403 self-elevation,
      409 a concurrent change (If-Match), 422 no roles or an invalid scope, otherwise
      standard Problem response. Roles (active role): ADMINISTRATOR.
    security:
      - IdamBearer: []
    x-dahc-roles:
      - ADMINISTRATOR
    parameters:
      - name: staffUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - roles
            properties:
              roles:
                type: array
                minItems: 1
                items:
                  $ref: "../components/schemas.yaml#/StaffRoleAssignment"
    responses:
      "200":
        description: Roles updated.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/StaffUser"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"

/api/v1/admin/staff-users/{staffUserId}/deactivation:
  post:
    tags:
      - Administration
    operationId: deactivateStaffUser
    summary: Deactivate a staff user
    description: >-
      Administrator-only. A deactivated user is refused on the next request and is
      never reactivated by signing in. Open work assigned to the user stays assigned
      until a supervisor reassigns it. Audited. Success: 200 with the staff user.
      Empty: not applicable. Error: 409 already inactive or the caller's own account,
      otherwise standard Problem response. Roles (active role): ADMINISTRATOR.
    security:
      - IdamBearer: []
    x-dahc-roles:
      - ADMINISTRATOR
    parameters:
      - name: staffUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - reason
            properties:
              reason:
                type: string
                minLength: 3
                maxLength: 500
    responses:
      "200":
        description: Staff user deactivated.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/StaffUser"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"

