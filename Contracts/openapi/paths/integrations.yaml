/api/v1/integrations/payment-events:
  post:
    tags:
      - Payments
    operationId: receivePaymentGatewayEvent
    summary: Receive an authenticated payment gateway event
    description: >-
      Internal adapter-to-platform operation. The provider-specific adapter verifies
      the provider callback, maps it to PaymentGatewayEvent, and authenticates to
      this API with a provider-scoped service identity. The service identity must
      be authorized for the provider value in the event. This endpoint never accepts
      raw E-Pay or Network International payloads. Event idempotency is scoped to
      provider plus providerEventId. Success: 202 with accepted event ID. Empty: duplicate
      event returns 200 with already-processed outcome. Error: 401/403 invalid adapter
      authorization, 409 conflicting event, or standard Problem response. Never transition
      an application to Submitted from an unverified callback. BRD: US-1.3.12, US-1.3.13.
      Access: integration clients holding permission payments.events-write only; user
      tokens get 403.
    security:
      - IdamBearer: []
    parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PaymentGatewayEvent"
    responses:
      "202":
        description: Event accepted for idempotent processing.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/WorkflowActionResult"
      "200":
        description: Duplicate event was already processed.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/WorkflowActionResult"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles: []
    x-dahc-integration-permission: payments.events-write
