/api/v1/referee/dashboard:
  get:
    tags:
      - Portfolio Scoring
    operationId: getRefereeDashboard
    summary: Get the referee's queue insights and inbox
    description: >-
      Returns the count of portfolios awaiting retrieval in the referee's pools for
      their role, personal-queue insights and the inbox of retrieved portfolios, oldest
      due date first. Candidate identity is never returned. Success: 200 with RefereeDashboard.
      Empty: 200 with zero counts and an empty data list and a messageCode. Error:
      standard Problem response. BRD: US-3.1.1, US-3.1.2. Roles (active role): REFEREE,
      THIRD_REFEREE, SECOND_EVALUATION_REFEREE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/CycleIdOptional"
      - name: round
        in: query
        schema:
          type: string
          enum:
            - ROUND_1
            - ROUND_2
            - ROUND_3
            - SECOND_EVALUATION
      - name: portfolioStatus
        in: query
        schema:
          $ref: "../components/schemas.yaml#/PortfolioStatus"
      - name: q
        in: query
        description: Free-text search over application number.
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
      - name: sort
        in: query
        description: >-
          Allow-listed sort keys, comma-separated; prefix with - for descending. Allowed:
          dueAt, retrievedAt, applicationId, round, portfolioStatus. Unsupported keys
          return 400 request.invalid_sort.
        schema:
          type: string
          default: dueAt
    responses:
      "200":
        description: Referee dashboard.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/RefereeDashboard"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - REFEREE
      - THIRD_REFEREE
      - SECOND_EVALUATION_REFEREE

/api/v1/senior-referee/dashboard:
  get:
    tags:
      - Portfolio Scoring
    operationId: getSeniorRefereeDashboard
    summary: Get senior referee pool insights and referee workload
    description: >-
      Senior-referee only. Returns all-pools scoring insights and the Referees Workload
      panel, filtered by cycle, program and specialty. Success: 200 with SeniorRefereeDashboard.
      Empty: 200 with zero counts and an empty panel. Error: standard Problem response.
      BRD: US-3.1.3. Roles (active role): SENIOR_REFEREE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/CycleIdOptional"
      - name: programId
        in: query
        schema:
          type: string
          format: uuid
      - name: specialtyId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Senior referee dashboard.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/SeniorRefereeDashboard"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - SENIOR_REFEREE

/api/v1/senior-referee/portfolios/{portfolioId}:
  get:
    tags:
      - Portfolio Scoring
    operationId: getPortfolioForSeniorReferee
    summary: View scoring rounds and workload details for a portfolio
    description: >-
      Senior referee may view portfolio rounds, referee assignments, question scores,
      and discrepancy details within authorized scope. Candidate identity remains
      hidden. Success: 200 with PortfolioReview and round-summary data. Empty: 404
      if missing or outside scope. Error: standard Problem response. BRD: US-3.1.3.
      Roles (active role): SENIOR_REFEREE.
    security:
      - IdamBearer: []
    parameters:
      - name: portfolioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Portfolio and permitted round oversight information.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/SeniorPortfolioReview"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - SENIOR_REFEREE

/api/v1/referee/pools/{poolId}/portfolio-retrievals:
  post:
    tags:
      - Portfolio Scoring
    operationId: retrievePortfoliosFromPool
    summary: Retrieve eligible anonymized portfolios
    description: >-
      Retrieves only portfolios eligible for the authenticated referee's assigned
      role and round, respecting workload, COI, and due-date rules. Success: 200 with
      anonymized WorkItemList. Empty: 200 with an empty data list and a messageCode
      when no eligible portfolios exist. Error: 409 when cap/state prevents retrieval;
      otherwise standard Problem response. BRD: US-3.2.1. Roles (active role): REFEREE,
      THIRD_REFEREE, SECOND_EVALUATION_REFEREE.
    security:
      - IdamBearer: []
    parameters:
      - name: poolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: requestedCount
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    responses:
      "200":
        description: Retrieved anonymized portfolios, possibly an empty list.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiListResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "../components/schemas.yaml#/WorkItem"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - REFEREE
      - THIRD_REFEREE
      - SECOND_EVALUATION_REFEREE

/api/v1/referee/portfolios/{portfolioId}:
  get:
    tags:
      - Portfolio Scoring
    operationId: getAssignedAnonymizedPortfolio
    summary: Read an assigned anonymized portfolio
    description: >-
      Returns only content permitted for the authenticated referee's assigned round;
      identity and prohibited prior-round information are omitted. Success: 200 with
      PortfolioReview. Empty: 404 if missing or not assigned. Error: standard Problem
      response. BRD: US-3.3.1. Roles (active role): REFEREE, THIRD_REFEREE, SECOND_EVALUATION_REFEREE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/PortfolioId"
    responses:
      "200":
        description: Anonymized portfolio and permitted rubric content.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/PortfolioReview"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - REFEREE
      - THIRD_REFEREE
      - SECOND_EVALUATION_REFEREE

/api/v1/referee/portfolios/{portfolioId}/conflict-of-interest:
  post:
    tags:
      - Portfolio Scoring
    operationId: declarePortfolioConflictOfInterest
    summary: Return a portfolio due to conflict of interest
    description: >-
      Records the COI declaration, removes this referee from the portfolio, and excludes
      the referee from reassignment to the same portfolio. Success: 200 with workflow
      result. Empty: not applicable. Error: 409 if the assignment is no longer active,
      otherwise standard Problem response. BRD: US-3.3.2. Roles (active role): REFEREE,
      THIRD_REFEREE, SECOND_EVALUATION_REFEREE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/PortfolioId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - reason
            properties:
              reason:
                type: string
                minLength: 3
                maxLength: 500
                description: Mandatory free-text reason (US-3.3.2 data dictionary).
    responses:
      "200":
        description: COI recorded and assignment returned.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/WorkflowActionResult"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - REFEREE
      - THIRD_REFEREE
      - SECOND_EVALUATION_REFEREE

/api/v1/referee/portfolios/{portfolioId}/scores:
  put:
    tags:
      - Portfolio Scoring
    operationId: savePortfolioQuestionScores
    summary: Save question scores for the assigned evaluation round
    description: >-
      Saves only the authenticated referee's assigned round and rubric version. Success:
      200 with saved ScoreSet. Empty: not applicable. Error: 409 if not assigned/editable,
      422 invalid rubric values, otherwise standard Problem response. Third-referee
      and second-evaluation visibility restrictions are enforced server-side. Each
      question is ACCEPT or REJECT; points-system questions need a classification
      and rejections need one or more reasons. The response carries the computed question
      scores and total. BRD: US-3.3.3. Roles (active role): REFEREE, THIRD_REFEREE,
      SECOND_EVALUATION_REFEREE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/PortfolioId"
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/ScoreSet"
    responses:
      "200":
        description: Scores saved for the active round.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/ScoreSet"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "412":
        $ref: "../components/responses.yaml#/PreconditionFailed"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "428":
        $ref: "../components/responses.yaml#/PreconditionRequired"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - REFEREE
      - THIRD_REFEREE
      - SECOND_EVALUATION_REFEREE

/api/v1/referee/portfolios/{portfolioId}/score-submission:
  post:
    tags:
      - Portfolio Scoring
    operationId: submitPortfolioScoringRound
    summary: Submit an evaluation round and run discrepancy processing
    description: >-
      Completes the authenticated referee's round, computes totals, determines discrepancy/third-referee
      or final/second-evaluation state, and recalculates the weighted final score
      when appropriate. Success: 200 with authoritative workflow result. Empty: not
      applicable. Error: 409 incomplete or stale round, 422 invalid submission, or
      standard Problem response. Processing is idempotent and audited. BRD: US-3.3.4.
      Roles (active role): REFEREE, THIRD_REFEREE, SECOND_EVALUATION_REFEREE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/PortfolioId"
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/ScoreSubmission"
    responses:
      "200":
        description: Round submitted and portfolio workflow advanced.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/PortfolioScoringResult"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - REFEREE
      - THIRD_REFEREE
      - SECOND_EVALUATION_REFEREE

/api/v1/senior-referee/portfolios/{portfolioId}/assignment:
  put:
    tags:
      - Portfolio Scoring
    operationId: reassignPortfolio
    summary: Reassign a portfolio to another referee
    description: >-
      Senior-referee only. Moves a portfolio from a referee's inbox to a referee of
      the same pool who has not scored it or returned it for conflict of interest
      (see listEligibleReferees). Retrieval and due dates are reset and the target
      referee is notified. Score corrections use overridePortfolioRoundScore. Success:
      200 with work item. Empty: not applicable. Error: 409 when the portfolio is
      no longer in a referee's inbox, 422 ineligible target, otherwise standard Problem
      response. BRD: US-3.2.2 AC2-AC4. Roles (active role): SENIOR_REFEREE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/PortfolioId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/AssignmentRequest"
    responses:
      "200":
        description: Assignment updated and target referee notified.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/WorkItem"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - SENIOR_REFEREE

/api/v1/senior-referee/portfolios/{portfolioId}/evidence/{evidenceId}/replacement:
  put:
    tags:
      - Portfolio Scoring
    operationId: replacePortfolioEvidence
    summary: Replace portfolio evidence under senior-referee authority
    description: >-
      Stores a new evidence version while retaining the prior version and audit record.
      Success: 200 with attachment metadata. Empty: not applicable. Error: 409 state
      conflict, 413/415 file constraints, or standard Problem response. BRD: US-3.2.3.
      Roles (active role): SENIOR_REFEREE, ADMISSION_SUPERVISOR.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/PortfolioId"
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
              - reason
            properties:
              file:
                type: string
                format: binary
              reason:
                type: string
                minLength: 1
                maxLength: 500
    responses:
      "200":
        description: New evidence version stored.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/AttachmentMetadata"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "413":
        description: File exceeds configured maximum size.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
      "415":
        description: Unsupported file type.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
    x-dahc-roles:
      - SENIOR_REFEREE
      - ADMISSION_SUPERVISOR

/api/v1/senior-referee/referees/{refereeId}/portfolios:
  get:
    tags:
      - Portfolio Scoring
    operationId: listRefereePortfoliosForSeniorReferee
    summary: List the portfolios in a referee's inbox
    description: >-
      Senior-referee only second level of the Referees Workload panel. Only these
      portfolios are eligible for reassignment. Success: 200 with RefereeInboxList.
      Empty: 200 with an empty data list and a messageCode. Error: 404 unknown referee,
      otherwise standard Problem response. BRD: US-3.1.3, US-3.2.2 note 1. Roles (active
      role): SENIOR_REFEREE.
    security:
      - IdamBearer: []
    parameters:
      - name: refereeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "../components/parameters.yaml#/CycleIdOptional"
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
      - name: sort
        in: query
        description: >-
          Allow-listed sort keys, comma-separated; prefix with - for descending. Allowed:
          dueAt, retrievedAt, applicationId, round, portfolioStatus. Unsupported keys
          return 400 request.invalid_sort.
        schema:
          type: string
          default: dueAt
    responses:
      "200":
        description: Referee inbox.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiListResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "../components/schemas.yaml#/RefereeInboxItem"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - SENIOR_REFEREE

/api/v1/senior-referee/portfolios/{portfolioId}/eligible-referees:
  get:
    tags:
      - Portfolio Scoring
    operationId: listEligibleReferees
    summary: List referees a portfolio can be reassigned to
    description: >-
      Senior-referee only source for the Target Referee list: referees of the same
      pool and round role, excluding anyone who scored the portfolio in any round
      or returned it for conflict of interest. Success: 200 with StaffUserList. Empty:
      200 with an empty data list and a messageCode. Error: standard Problem response.
      BRD: US-3.2.2 note 2, STP-3.2 rules 5-6. Roles (active role): SENIOR_REFEREE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/PortfolioId"
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
    responses:
      "200":
        description: Eligible referees.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiListResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "../components/schemas.yaml#/StaffUserSummary"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - SENIOR_REFEREE

/api/v1/senior-referee/portfolios/{portfolioId}/score-overrides:
  post:
    tags:
      - Portfolio Scoring
    operationId: overridePortfolioRoundScore
    summary: Override a round score in an exceptional case
    description: >-
      Senior-referee only exceptional correction with a mandatory justification. Sets
      the total of Round 1, Round 2, Round 3 or 2nd Evaluation, keeps the previous
      value in the audit trail and recomputes the final and weighted portfolio scores
      (and the shortlisting score). Success: 200 with PortfolioScoringResult. Empty:
      not applicable. Error: 409 when the round is not Complete, 422 when the score
      exceeds the question set total, otherwise standard Problem response. BRD: US-3.2.2
      AC5-AC6, notes 3-4. Roles (active role): SENIOR_REFEREE.
    security:
      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/PortfolioId"
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/ScoreOverrideRequest"
    responses:
      "200":
        description: Round score overridden and portfolio score recomputed.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas.yaml#/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/schemas.yaml#/PortfolioScoringResult"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/Validation"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
    x-dahc-roles:
      - SENIOR_REFEREE

/api/v1/referee/portfolios/{portfolioId}/evidence/{evidenceId}/content:
  get:
    tags:
      - Portfolio Scoring
    operationId: downloadPortfolioEvidence
    summary: View or download portfolio evidence
    description: >-
      Assigned referee only, for the active round. Streams the active evidence version
      from FileNet through the API. The file may reveal the candidate's name; see
      the conflict-of-interest return. Success: 200 with the file. Empty: not applicable.
      Error: 404 when missing or not assigned, 503 when FileNet or Rhapsody is unavailable,
      otherwise standard Problem response. BRD: US-3.3.1 AC4, note 6. Roles (active
      role): REFEREE, THIRD_REFEREE, SECOND_EVALUATION_REFEREE.
