      - IdamBearer: []
    parameters:
      - $ref: "../components/parameters.yaml#/PortfolioId"
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Evidence content.
        headers:
          Content-Disposition:
            description: attachment; filename of the stored file.
            schema:
              type: string
          Cache-Control:
            description: Always private, no-store.
            schema:
              type: string
              const: private, no-store
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
