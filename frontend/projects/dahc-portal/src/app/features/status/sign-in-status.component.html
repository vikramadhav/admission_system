@if (hasFailed()) {
  <dahc-page-header i18n-heading="@@portal.signIn.failedHeading" heading="We could not sign you in" [focusOnLoad]="true" />
  <div class="dahc-portal-page">
    <dahc-alert variant="error">
      <p class="dahc-portal-text">{{ failureMessage() }}</p>
      @if (problem()?.traceId; as traceId) {
        <p class="dahc-portal-text" i18n="@@portal.problem.traceId">Reference for support: {{ traceId }}</p>
      }
    </dahc-alert>
    <div class="dahc-portal-actions">
      <button dahc-button type="button" (click)="tryAgain()" i18n="@@portal.action.tryAgain">Try again</button>
    </div>
  </div>
} @else {
  <dahc-page-header i18n-heading="@@portal.signIn.inProgressHeading" heading="Signing you in" />
  <div class="dahc-portal-page">
    <p class="dahc-portal-text" role="status" i18n="@@portal.signIn.inProgress">Please wait while we open your dashboard.</p>
  </div>
}
