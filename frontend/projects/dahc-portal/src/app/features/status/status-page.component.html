<dahc-page-header [heading]="text().heading" [focusOnLoad]="true" />
<div class="dahc-portal-page">
  <dahc-alert [variant]="kind() === 'signed-out' ? 'success' : 'warning'">{{ text().message }}</dahc-alert>
  <div class="dahc-portal-actions">
    @if (showSignIn()) {
      <button dahc-button type="button" (click)="signIn()" i18n="@@portal.action.signIn">Sign in</button>
    }
    @if (showSignOut()) {
      <button dahc-button type="button" (click)="signOut()" i18n="@@portal.action.signOut">Sign out</button>
    }
    @if (showHomeLink()) {
      <a dahc-button variant="secondary" routerLink="/" i18n="@@portal.action.goToDashboard">Go to your dashboard</a>
    }
  </div>
</div>
