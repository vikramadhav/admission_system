<div class="dahc-alert__box" [attr.role]="role()">
  <span class="dahc-alert__icon" aria-hidden="true"></span>
  <div class="dahc-alert__content">
    <span class="dahc-visually-hidden">{{ variantLabel() }}: </span>
    @if (heading() !== '') {
      <p class="dahc-alert__heading">{{ heading() }}</p>
    }
    <div class="dahc-alert__body"><ng-content /></div>
  </div>
  @if (dismissible()) {
    <button type="button" class="dahc-alert__dismiss" [attr.aria-label]="dismissLabel()" (click)="dismiss()">
      <span class="dahc-alert__dismiss-icon" aria-hidden="true"></span>
    </button>
  }
</div>
