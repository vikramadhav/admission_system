<ul class="dahc-tree__root" role="tree" [attr.aria-label]="label()">
  <ng-container [ngTemplateOutlet]="branch" [ngTemplateOutletContext]="{ $implicit: items(), level: 1 }" />
</ul>

<ng-template #branch let-nodes let-level="level">
  @for (node of nodes; track node.value; let position = $index) {
    <li
      class="dahc-tree__item"
      role="treeitem"
      [attr.data-value]="node.value"
      [attr.aria-level]="level"
      [attr.aria-setsize]="nodes.length"
      [attr.aria-posinset]="position + 1"
      [attr.aria-expanded]="hasChildren(node) ? isOpen(node) : null"
      [attr.aria-selected]="node.value === value()"
      [attr.aria-disabled]="node.disabled ? 'true' : null"
      [attr.tabindex]="node.value === tabStop() ? 0 : -1"
      (focus)="onFocus(node, $event)">
      <div class="dahc-tree__row" [style.--_depth]="level - 1">
        <span class="dahc-tree__toggle" aria-hidden="true">
          @if (hasChildren(node)) {
            <dahc-icon class="dahc-tree__chevron" name="chevron-right" size="sm" />
          }
        </span>
        <span class="dahc-tree__label">{{ node.label }}</span>
      </div>
      @if (hasChildren(node) && isOpen(node)) {
        <ul class="dahc-tree__group" role="group">
          <ng-container [ngTemplateOutlet]="branch" [ngTemplateOutletContext]="{ $implicit: node.children, level: level + 1 }" />
        </ul>
      }
    </li>
  }
</ng-template>
