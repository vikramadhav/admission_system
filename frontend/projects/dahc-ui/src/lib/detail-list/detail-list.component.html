<dl class="dahc-detail-list__list">
  @for (item of items(); track item.label) {
    <div class="dahc-detail-list__item">
      <dt class="dahc-detail-list__label">{{ item.label }}</dt>
      <dd class="dahc-detail-list__value" [class.dahc-detail-list__value--empty]="item.value === ''">
        {{ item.value === '' ? emptyValue() : item.value }}
      </dd>
    </div>
  }
</dl>
