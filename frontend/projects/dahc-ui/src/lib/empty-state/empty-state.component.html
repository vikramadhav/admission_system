<div class="dahc-empty-state__box">
  <span class="dahc-empty-state__illustration" aria-hidden="true"></span>
  @if (headingLevel() === 2) {
    <h2 class="dahc-empty-state__heading">{{ heading() }}</h2>
  } @else {
    <h3 class="dahc-empty-state__heading">{{ heading() }}</h3>
  }
  @if (description() !== '') {
    <p class="dahc-empty-state__description">{{ description() }}</p>
  }
  <div class="dahc-empty-state__actions"><ng-content /></div>
</div>
