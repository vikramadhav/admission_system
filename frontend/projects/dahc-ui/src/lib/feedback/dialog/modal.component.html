<dialog
  #dialog
  class="dahc-modal"
  [attr.aria-labelledby]="heading() ? headingId : null"
  (cancel)="onCancel($event)">
  <div class="dahc-modal__panel">
    <header class="dahc-modal__header">
      <ng-content select="[dahcDialogIcon]" />
      @if (heading()) {
        <h2 class="dahc-modal__title" [id]="headingId">{{ heading() }}</h2>
      }
      @if (closable()) {
        <button type="button" class="dahc-dialog-close" (click)="requestClose('close-button')">
          <dahc-icon name="x-close" size="lg" />
          <span class="dahc-visually-hidden">{{ closeLabel() }}</span>
        </button>
      }
    </header>
    <div class="dahc-modal__body"><ng-content /></div>
    <footer class="dahc-modal__footer"><ng-content select="[dahcDialogFooter]" /></footer>
  </div>
</dialog>
