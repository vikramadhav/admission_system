<dahc-form-field
  [label]="label()"
  [hint]="description()"
  [error]="errorMessage()"
  [invalid]="invalid()"
  [required]="required()">
  <select
    dahcInput
    class="dahc-select__native"
    [value]="value()"
    [disabled]="isDisabled()"
    [required]="required()"
    (change)="onSelectionChange($event)"
    (blur)="onBlur()">
    <option value="" [selected]="value() === ''">{{ placeholder() }}</option>
    @for (option of options(); track option.value) {
      <option [value]="option.value" [disabled]="option.disabled ?? false" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
  </select>
  <dahc-icon dahcFieldEnd class="dahc-select__chevron" name="chevron-down" size="lg" />
</dahc-form-field>
