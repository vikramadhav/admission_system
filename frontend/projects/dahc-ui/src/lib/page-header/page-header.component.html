<div class="dahc-page-header__band">
  <div class="dahc-page-header__inner">
    <div class="dahc-page-header__titles">
      <h1 #headingElement class="dahc-page-header__heading" tabindex="-1">{{ heading() }}</h1>

        <p class="dahc-page-header__description">{{ description() }}</p>
      }

    <div class="dahc-page-header__actions"><ng-content select="[page-header-actions]" /></div>
  </div>
</div>
