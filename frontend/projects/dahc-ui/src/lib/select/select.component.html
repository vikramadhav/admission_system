<label class="dahc-select__label" [for]="controlId">
  {{ label() }}
  @if (required()) {
    <span class="dahc-select__required" aria-hidden="true">*</span>
  }
</label>
@if (description() !== '') {
  <p class="dahc-select__description" [id]="descriptionId">{{ description() }}</p>
}
<div class="dahc-select__control">
  <select
    class="dahc-select__native"
    [id]="controlId"
    [value]="value()"
    [disabled]="isDisabled()"
    [required]="required()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (change)="onSelectionChange($event)"
    (blur)="onBlur()">
    <option value="" [selected]="value() === ''">{{ placeholder() }}</option>
    @for (option of options(); track option.value) {
      <option [value]="option.value" [disabled]="option.disabled ?? false" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
  </select>
  <span class="dahc-select__chevron" aria-hidden="true"></span>
</div>
@if (showError()) {
  <p class="dahc-select__error" [id]="errorId">{{ errorMessage() }}</p>
}
