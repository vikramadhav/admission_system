<h1 class="pg-page-heading">{{ heading() }}</h1>
<p class="pg-page-description">{{ description() }}</p>

<div class="pg-page-top">
  <section class="pg-panel pg-preview" aria-labelledby="preview-heading">
    <h2 id="preview-heading" class="pg-panel-heading">Preview</h2>
    <div class="pg-preview-stage"><ng-content select="[preview]" /></div>
  </section>
  <section class="pg-panel" aria-labelledby="inspector-heading">
    <h2 id="inspector-heading" class="pg-panel-heading">Properties</h2>
    <ng-content select="[inspector]" />
  </section>
</div>

<section class="pg-panel" aria-labelledby="states-heading">
  <h2 id="states-heading" class="pg-panel-heading">States</h2>
  <div class="pg-states"><ng-content select="[states]" /></div>
</section>

<section class="pg-panel" aria-labelledby="a11y-heading">
  <h2 id="a11y-heading" class="pg-panel-heading">Accessibility</h2>
  <ng-content select="[accessibility]" />
</section>

<section class="pg-panel" aria-labelledby="source-heading">
  <h2 id="source-heading" class="pg-panel-heading">Source</h2>
  <dahc-source-viewer [files]="sourceFiles()" />
</section>
