<div class="dahc-preference" [formGroup]="group()">
  <dahc-select
    formControlName="specialtyId"
    [label]="specialtyLabel()"
    [options]="specialtyOptions()"
    [required]="required()"
    [invalid]="specialtyError() !== ''"
    [errorMessage]="specialtyError()" />

  @if (specialtyId() !== '') {
    @if (sites.isLoading()) {
      <p class="dahc-portal-text" role="status" i18n="@@portal.draft.loadingSites">Loading training sites…</p>
    } @else if (noSitesMessage() !== '') {
      <p class="dahc-portal-text">{{ noSitesMessage() }}</p>
    } @else {
      <dahc-ranked-selection
        formControlName="siteIds"
        [label]="sitesLabel()"
        i18n-description="@@portal.draft.sitesDescription"
        description="Choose one or more sites. When you choose more than one, put them in your order of preference."
        [options]="siteOptions()"
        [required]="true"
        [invalid]="sitesError() !== ''"
        [errorMessage]="sitesError()" />
    }
  }
</div>
